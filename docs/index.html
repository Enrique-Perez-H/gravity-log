<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ascend</title>
<meta name="theme-color" content="#2F45C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ascend">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow training column, three tabs (Train / Progress / Program), phone-first. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#18201D; --muted:#5B6661; --line:#D5DCD9;
  --accent:#2F45C8; --accent-ink:#FFFFFF; --accent-soft:#E3E7FB;
  --skin:#E6D2C2; --skin-line:#B79F8C; --mus-main:#D8452F; --mus-also:#F0A93E;
  --chalk:#B7791F; --chalk-soft:#F6EBD9; --good:#1F7A4D; --good-soft:#DDF1E6; --warn:#A8521E; --warn-soft:#F8E4D8;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A211E; --ink:#E7EDEA; --muted:#9AA6A0; --line:#2C3632;
  --accent:#8C9CFF; --accent-ink:#0E1330; --accent-soft:#232A52;
  --skin:#6B5F57; --skin-line:#8A7B70; --mus-main:#FF7358; --mus-also:#E9B04F;
  --chalk:#E2B05E; --chalk-soft:#3A2F1C; --good:#5CC98F; --good-soft:#173A28; --warn:#F0A070; --warn-soft:#41291B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A211E; --ink:#E7EDEA; --muted:#9AA6A0; --line:#2C3632;
  --accent:#8C9CFF; --accent-ink:#0E1330; --accent-soft:#232A52;
  --skin:#6B5F57; --skin-line:#8A7B70; --mus-main:#FF7358; --mus-also:#E9B04F;
  --chalk:#E2B05E; --chalk-soft:#3A2F1C; --good:#5CC98F; --good-soft:#173A28; --warn:#F0A070; --warn-soft:#41291B; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-size:1rem;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:.85rem}
.store{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
nav.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .9rem var(--body);padding:10px 6px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border-radius:12px;padding:12px 14px;font-size:.9rem}
.banner.deload{background:var(--chalk-soft);color:var(--ink);border:1px solid var(--chalk)}
.banner.info{background:var(--accent-soft)}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.block-h .min{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.pair{grid-template-columns:1fr}}
.ex-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pattern{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lvl{font-family:var(--mono);font-size:.72rem;color:var(--accent);white-space:nowrap}
.cue{font-size:.85rem;color:var(--muted)}
.target{font-family:var(--mono);font-size:.8rem}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.set .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);width:3.2em}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
.step button{border:0;background:var(--bg);color:var(--ink);width:38px;height:38px;font-size:1.1rem;cursor:pointer}
.step input{width:56px;height:38px;border:0;border-inline:1px solid var(--line);text-align:center;font:500 1rem var(--mono);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.step input::-webkit-inner-spin-button{appearance:none}
.unit{font-size:.75rem;color:var(--muted);margin-left:6px}
.tick{width:42px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.hit{color:var(--good);font-weight:600}
.checklist{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);font-size:.9rem;width:100%}
.check .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem}
.check[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.check[aria-pressed="true"] span.t{color:var(--muted);text-decoration:line-through}
.finish{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;font-size:.95rem}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--warn);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.up{background:var(--chalk-soft);color:var(--chalk)}
.pill.stall{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:800 1.9rem var(--display);line-height:1}
.stat span{font-size:.75rem;color:var(--muted)}
.cal{overflow-x:auto}
.cal svg{display:block;min-width:300px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.ladder i.on{background:var(--accent)}
.spark{width:100%;height:56px;display:block}
.last{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.lv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lv-list li{display:grid;grid-template-columns:2em 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:.88rem}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tbtn:disabled{opacity:.5;cursor:default}
.plan-list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.wk{overflow-x:auto}
.wk table{border-collapse:collapse;width:100%;font-size:.85rem}
.wk th,.wk td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.wk td:nth-child(n+2),.wk th:nth-child(n+2){font-family:var(--mono)}
.lv-btns{display:flex;gap:6px;align-items:center}
.lv-list li .lv-panel{grid-column:1/-1}
.lv-list li.cur{background:var(--accent-soft)}
.lv-list li .k{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.lv-list li .r{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.lv-list button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:.72rem;cursor:pointer}
.prose{max-width:65ch;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.hist .meta{font-family:var(--mono);font-size:.78rem}
.timer{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:6px;align-items:center;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ed{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:12px}
.ed-top{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ed input[type=date],.ed select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.ed-ex{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ed-sets{display:flex;gap:10px;flex-wrap:wrap}
.ed-set{display:flex;flex-direction:column;gap:4px;font-size:.8rem}
.ed-set input[type=number]{width:64px;font:500 1rem var(--mono);padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.set.gym{grid-template-columns:auto 1fr auto}
.gym-steps{display:flex;align-items:center;gap:2px 4px;flex-wrap:wrap}
.set.gym{gap:6px}
.set.gym .n{width:auto;font-size:.7rem}
.set.gym .step button{width:26px}
.set.gym .step input{width:38px;font-size:.95rem}
.set.gym .unit{margin-left:1px;margin-right:2px;min-width:0;font-size:.68rem;white-space:nowrap}
.ed-set label{display:flex;align-items:center;gap:4px}
.ed-set input[type=number]{width:70px}
.cf{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted)}
.cf input,.cf select{font:inherit;color:var(--ink);padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
.cf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.cchart{width:100%;height:auto;display:block}
.hold{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;height:38px;min-width:42px;padding:0 8px;margin-left:6px;font:500 .85rem var(--mono);cursor:pointer}
.hold.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.timer b{font:500 1rem var(--mono);min-width:3.2em;text-align:center}
.timer button{border:0;border-radius:99px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.timer button.alt{background:transparent;color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:20;max-width:min(92vw,460px);font-size:.9rem}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.data-actions{display:flex;gap:8px;flex-wrap:wrap}
.banner.backup{background:var(--warn-soft);border:1px solid var(--warn)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
.tbtn[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:.8rem;cursor:pointer}
.chip[aria-pressed="true"]::before{content:"✕ "}
.panel{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.panel a{color:var(--accent)}
.needs{font-size:.78rem;color:var(--muted)}
.needs.miss{color:var(--warn);font-weight:600}
.alt-opt{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.alt-opt .cue{grid-column:1/-1}
.fig{display:grid;max-width:340px}
.fig svg{width:100%;height:auto;background:var(--bg);border-radius:10px}
.fig .skin{fill:var(--skin);stroke:var(--skin-line);stroke-width:.6;stroke-linejoin:round}
.fig .skin.far{opacity:.55}
.fig .mus{stroke:none}
.fig .mus.main{fill:var(--mus-main)}
.fig .mus.also{fill:var(--mus-also);opacity:.9}
.fig .sep{stroke:var(--skin-line);stroke-width:.8;stroke-linecap:round}
.fig .shadow{fill:var(--ink);opacity:.1}
.fig .floor{stroke:var(--line);stroke-width:1.5}
.fig .prop{stroke:var(--accent);stroke-width:2.6;stroke-linecap:round}
.fig .thin{stroke-width:1;opacity:.5}
.fig .wall{fill:var(--line)}
.fig.still{grid-template-columns:1fr 1fr;gap:6px}
.fig.photo{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--bg)}
.fig.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fig.photo img.b{opacity:0}
.fig.still.photo{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:auto;gap:6px}
.fig.still.photo img{position:static;aspect-ratio:16/9;opacity:1}
.video{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--bg)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (prefers-reduced-motion:no-preference){nav.tabs button,.tick,.check .box{transition:background .15s,color .15s}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Ascend</h1>
      <div class="sub" id="tagline">Training log and planner</div>
    </div>
    <div class="store" id="store">Loading…</div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-train" aria-selected="true" data-tab="train">Train</button>
    <button role="tab" id="tab-progress" aria-selected="false" data-tab="progress">Progress</button>
    <button role="tab" id="tab-routine" aria-selected="false" data-tab="routine">Routine</button>
    <button role="tab" id="tab-program" aria-selected="false" data-tab="program">Program</button>
    <button role="tab" id="tab-settings" aria-selected="false" data-tab="settings">Settings</button>
  </nav>

  <main id="view"></main>
</div>

<div class="timer" id="timer">
  <b id="tclock">1:30</b>
  <button id="tstart" type="button">Rest 90 s</button>
  <button id="tlen" class="alt" type="button" aria-label="Change the rest length">90 s</button>
  <button id="treset" class="alt" type="button" hidden>Stop</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Program definition ---------- */
const EX = {
  handstand:{name:"Handstand",pattern:"Skill · balance",unit:"s",levels:[
    ["Wall plank","Feet on the wall at hip height, hands under shoulders, body straight. Push the floor away.",15,30],
    ["Chest-to-wall handstand","Walk up until your chest faces the wall, hands 10–20 cm from it. Ribs in, shoulders pushed up to the ears.",20,45],
    ["Chest-to-wall, long hold","Same position, longer. Practise lifting one foot off the wall for a moment.",30,60],
    ["Toe pulls off the wall","Back to the wall. Pull your feet off and balance with your fingers.",5,15],
    ["Freestanding kick-up","Kick up in open space and hold any balance. Bail by turning out to the side.",3,10],
    ["Freestanding handstand","Straight line; correct with fingers (falling forward) and palms (falling back).",10,30],
    ["Freestanding handstand, long","Same, building toward a minute.",30,60]]},
  pullup:{name:"Pull-up",pattern:"Vertical pull",unit:"reps",levels:[
    ["Scapular pulls","Dead hang, then pull the shoulder blades down without bending the elbows.",5,10],
    ["Negative pull-ups","Jump to chin over bar, lower yourself in 5 seconds.",3,5],
    ["Pull-ups","Full hang to chin over bar. No kipping.",3,8],
    ["Chest-to-bar pull-ups","Pull higher, until the bar touches the upper chest.",4,8],
    ["Archer pull-ups","Wide grip; pull toward one hand while the other arm straightens. Reps per side.",3,6],
    ["Typewriter pull-ups","Pull up, slide side to side at the top. Reps per side.",3,6],
    ["One-arm negatives","Pull up with two arms, lower on one in 5 s. Reps per side.",2,4],
    ["One-arm pull-up","Reps per side.",1,3]]},
  dip:{name:"Dip",pattern:"Vertical push · dips",unit:"reps",levels:[
    ["Support hold","Straight arms on parallel bars or two sturdy chairs, shoulders pushed down.",10,30],
    ["Negative dips","Start at the top, lower in 5 seconds to about 90° at the elbow.",3,5],
    ["Dips","Shoulders a little below elbows at the bottom, lock out at the top.",3,8],
    ["Paused dips","Two-second pause at the bottom.",5,8],
    ["Weighted dips","Backpack with books or water bottles.",5,8]]},
  pushup:{name:"Push-up",pattern:"Horizontal push",unit:"reps",levels:[
    ["Incline push-ups","Hands on a chair or table edge, body straight.",8,15],
    ["Push-ups","Chest to the floor, elbows about 45° from the body.",5,12],
    ["Parallette push-ups","Hands on the parallettes for a deeper range.",5,10],
    ["Diamond push-ups","Hands together under the chest.",5,10],
    ["Pseudo-planche push-ups","Hands by the hips, fingers turned out, lean forward over the hands.",5,8],
    ["Archer push-ups","Shift onto one arm while the other straightens. Reps per side.",4,8],
    ["Incline one-arm push-ups","One hand on a chair, feet wide. Reps per side.",3,6],
    ["One-arm push-up","Reps per side.",2,5]]},
  row:{name:"Row",pattern:"Horizontal pull",unit:"reps",levels:[
    ["Incline rows","Under a sturdy table edge or a low bar, body at about 45°, pull chest to the edge.",8,12],
    ["Horizontal rows","Body nearly horizontal, heels on the floor.",5,10],
    ["Feet-elevated rows","Feet on a chair so the body is level.",5,10],
    ["Archer rows","Pull toward one hand, other arm straight. Reps per side.",4,8],
    ["Tuck front lever rows","From a tuck front lever, pull the bar to the hips.",3,6],
    ["Advanced tuck front lever rows","Back flat, knees at hip level.",3,6]]},
  pike:{name:"Overhead press",pattern:"Overhead push",unit:"reps",levels:[
    ["Pike push-ups","Hips high, head goes in front of the hands.",5,10],
    ["Parallette pike push-ups","Hands on parallettes for more depth.",5,10],
    ["Feet-elevated pike push-ups","Feet on a chair, hips over hands.",5,8],
    ["Wall handstand push-up negatives","Lower from a wall handstand in 5 s to the head.",3,5],
    ["Wall HSPU, partial range","Lower to a cushion or folded mat and press back up.",3,6],
    ["Wall handstand push-ups","Head to the floor and back up.",3,8],
    ["Deficit wall HSPU","Hands on parallettes, lower below hand level.",3,6]]},
  frontlever:{name:"Front lever",pattern:"Straight-arm pull",unit:"s",levels:[
    ["Active hang","Hang with shoulders pulled down and back, arms straight.",15,30],
    ["Tuck front lever","Knees to chest, back horizontal, arms straight.",8,20],
    ["Advanced tuck front lever","Back flat, knees at hip level.",8,20],
    ["One-leg front lever","One leg straight, the other tucked. Alternate sets.",8,20],

function figTick(now){

    const c = (now % 3400) / 3400, u = c<.15 ? 0 : c<.5 ? (c-.15)/.35 : c<.65 ? 1 : 1-(c-.65)/.35;

async function deliver(text, type, name){
  const file = new File([text], name, {type});
  // On phones the share sheet lets you save to Files/Drive or send by email; elsewhere download directly.
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return true }catch(e){ if(e && e.name==="AbortError") return false }
  }
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  return true;
}

function importBackup(file){

    const backupNewest = Math.max(0,...b.sessions.map(s=>s.ts||0)), localNewest = Math.max(0,...S.sessions.map(s=>s.ts||0));

    if(b.plans && typeof b.plans==="object"){ Object.keys(b.plans).forEach(id=>{ if(!S.plans[id]) S.plans[id] = b.plans[id] }); if(backupNewest >= localNewest && S.plans[b.routine] && b.routine!=="cardio") S.routine = b.routine }

// A session's day label, using the routine it was logged with.
const dayLabelOf = s => { const d = routineById(s.routine||"calisthenics").days.find(x=>x.id===s.day); return d ? d.label : "Day "+s.day };
// Every exercise of a routine, once, in order.
const routineExercises = r => [...new Set(r.days.flatMap(d=>itemsOf(d).filter(it=>it.ex).map(it=>it.ex)))];
function weekNo(){
  if(!S.sessions.length) return 1;
  const first = new Date(S.sessions[0].date+"T12:00:00"), now = new Date();
  return Math.floor((now-first)/(7*864e5))+1;
}
const isDeload = () => S.sessions.length>0 && weekNo() % DELOAD_EVERY === 0;
// Every logged use of an alternative, oldest first: [{date, sets, done, subFor}].
function altEntries(id){
  const out = [];
  S.sessions.forEach(s=>Object.entries(s.entries||{}).forEach(([k,e])=>{ if(altOf(k)===id) out.push({date:s.date,...e}) }));
  return out;
}
function entriesFor(ex){ return S.sessions.filter(s=>s.entries && s.entries[ex]).map(s=>({date:s.date,...s.entries[ex]})) }
const fitSets = (arr, n, fill) => Array.from({length:n}, (_,i)=> i<arr.length ? arr[i] : (arr.length ? arr[arr.length-1] : fill));
function lastValues(ex, level, n=SETS){
  const e = entriesFor(ex).filter(x=>x.level===level).pop();
  return fitSets(e ? e.sets : [], n, lv(ex,level).min);
}
function score(e, ex){ const L=lv(ex,e.level); const done=e.sets.filter((v,i)=>e.done[i]); const best=done.length?Math.max(...done):0; return e.level + Math.min(best/L.max,1) }
function status(ex){
  const cur = S.levels[ex], es = entriesFor(ex).filter(x=>x.level===cur);
  if(!es.length) return {cls:"new",txt:"New level"};
  if(es.length>=3){
    const tot = e => e.sets.reduce((a,v,i)=>a+(e.done[i]?v:0),0);
    const last3 = es.slice(-3);
    if(tot(last3[2]) <= tot(last3[0])) return {cls:"stall",txt:"Stalled"};
  }
  const L=lv(ex,cur), last=es[es.length-1];
  const close = last.sets.every((v,i)=>last.done[i] && v>=L.max-1);
  return close ? {cls:"up",txt:"Close to level-up"} : {cls:"ok",txt:"Building"};
}

/* ---------- Draft (in-progress session, kept on this device) ---------- */
function newDraft(d){
  const entries = {}, r = R();
  itemsOf(dayOf(d)).forEach(it=>{
    if(it.gym){ entries[itemKey(it)] = gymEntryFor(it.slot, gymSets(it, r), it.reps); return }
    const l=S.levels[it.ex], n=it.sets||SETS;
    entries[it.ex] = it.sub ? {level:l, sub:it.sub, sets:altLastValues(it.sub,n), done:Array(n).fill(false)} : {level:l, sets:lastValues(it.ex,l,n), done:Array(n).fill(false)};
  });
  return {day:d, routine:S.routine, date:todayISO(), warm:Array(warmupOf(r).length).fill(false), missing:[], entries};
}
function ensureDraft(){
  if(draft && (draft.routine||"calisthenics")!==S.routine){ draft = null; day = null }
  if(!day) day = draft ? draft.day : nextDay();
  if(!R().days.some(d=>d.id===day)) day = R().days[0].id;
  if(!draft || draft.day!==day){ draft = newDraft(day); LS.set(KEY.draft,draft) }
  if(!draft.missing) draft.missing = [];
  // keep levels in line with the program if changed elsewhere
  Object.keys(draft.entries).forEach(ex=>{
    const l=S.levels[ex];
    if(draft.entries[ex].level!==l && !draft.entries[ex].sub && !draft.entries[ex].done.some(Boolean)){ const n=draft.entries[ex].sets.length; draft.entries[ex]={level:l,sets:lastValues(ex,l,n),done:Array(n).fill(false)} }
  });
}
const saveDraft = () => LS.set(KEY.draft,draft);


/* ---------- Language ---------- */
// English is the source text. In Spanish, everything on screen is translated after it is drawn: text and labels are looked up in the
// dictionary in lang-es.js (whole strings first, then strings with the numbers and known names taken out, then sentence by sentence).
const LANG = {code:"en", dict:null, names:null, nameRe:null, rules:[]};
const resolveLang = () => { const p = LS.get(KEY.lang,"auto"); return p==="auto" ? (/^es\b/i.test(navigator.language||"en") ? "es" : "en") : p };
const LOC = () => LANG.code==="es" ? "es-ES" : undefined;
const NUMRE = /\{\d+\}|\d+(?:\.\d+)?/g;
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function trFill(es, nums, names){
  let i = 0; es = es.replace(/#/g, ()=>{ const n = nums[i++]; return n===undefined ? "#" : n.replace(".",",") });
  return names ? es.replace(/\{(\d+)\}/g, (_,k)=>names[+k]) : es;
}
function trCore(c, depth){
  const D = LANG.dict;
  if(D[c]!==undefined) return D[c];
  if(LANG.names[c]!==undefined) return LANG.names[c];
  const nums = [], k1 = c.replace(NUMRE, x=>{ if(x[0]==="{") return x; nums.push(x); return "#" });
  if(nums.length && D[k1]!==undefined) return trFill(D[k1], nums);
  const names = [], sk = c.replace(LANG.nameRe, m=>{ names.push(LANG.names[m]||m); return "{"+(names.length-1)+"}" });
  if(names.length){
    if(D[sk]!==undefined) return trFill(D[sk], [], names);
    if(!/[A-Za-z]/.test(sk.replace(/\{\d+\}/g,""))) return trFill(sk, [], names);
    const n2 = [], sk2 = sk.replace(NUMRE, x=>{ if(x[0]==="{") return x; n2.push(x); return "#" });
    if(n2.length && D[sk2]!==undefined) return trFill(D[sk2], n2, names);
  }
  if(c.length>2 && c.endsWith(".") && !c.endsWith("..")){ const b = c.slice(0,-1), r = trCore(b, depth); if(r!==b) return r+"." }
  for(const [re,t] of LANG.rules){ const m = c.match(re); if(m) return t.replace(/\$(\d)/g, (_,i)=>m[i]===undefined ? "" : trCore(m[i],depth+1)) }
  if(depth<3){
    const parts = c.split(/(\s*[.:;,·—–]\s+|\s+\(|\)\s*|\s\|\s)/);
    if(parts.length>1){
      let changed = false;
      const out = parts.map((p,i)=>{ if(i%2 || !p) return p; const r = trCore(p, depth+1); if(r!==p) changed = true; return r });
      if(changed) return out.join("");
    }
  }
  return c;
}
function tr(s){
  if(LANG.code!=="es" || !LANG.dict) return s;
  const m = s.match(/^(\s*)([\s\S]*?)(\s*)$/); if(!m[2]) return s;
  const r = trCore(m[2],0);
  return m[1]+(r===m[2] ? r : r.replace(/(\d)\.(\d)/g,"$1,$2"))+m[3];
}
const TR_ATTRS = ["aria-label","title","placeholder","alt"];
const noTr = n => { const e = n.nodeType===1 ? n : n.parentNode; return !e || !!(e.closest && e.closest(".fig,[data-notr],script,style,textarea")) };
function trTextNode(n){
  if(noTr(n)) return;
  const cur = n.nodeValue, en = (n.__es!==undefined && cur===n.__es) ? n.__en : cur;
  n.__en = en; const out = tr(en); n.__es = out; if(out!==cur) n.nodeValue = out;
}
function trAttr(el, a){
  if(noTr(el)) return;
  const cur = el.getAttribute(a); if(cur===null) return;
  const st = el.__tr = el.__tr || {}, en = (st[a] && cur===st[a].es) ? st[a].en : cur, out = tr(en);
  st[a] = {en, es:out}; if(out!==cur) el.setAttribute(a, out);
}
function trTree(root){
  if(!root) return;
  if(root.nodeType===3){ trTextNode(root); return }
  if(root.nodeType!==1 || noTr(root)) return;
  [root, ...root.querySelectorAll("*")].forEach(el=>{ TR_ATTRS.forEach(a=>{ if(el.hasAttribute(a)) trAttr(el,a) }) });
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while(w.nextNode()) nodes.push(w.currentNode); nodes.forEach(trTextNode);
}
const trObs = new MutationObserver(recs=>{
  trObs.disconnect();
  try{ recs.forEach(r=>{ if(r.type==="characterData") trTextNode(r.target); else if(r.type==="attributes") trAttr(r.target, r.attributeName); else r.addedNodes.forEach(trTree) }) }
  finally{ trObsStart() }
});
function trObsStart(){ trObs.observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:TR_ATTRS}) }
function setDict(){
  LANG.dict = window.ES_DICT; LANG.names = window.ES_NAMES || {};
  LANG.rules = (window.ES_RULES || []).map(([src,t])=>[new RegExp(src),t]);
  const ns = Object.keys(LANG.names).sort((a,b)=>b.length-a.length).map(escRe);
  LANG.nameRe = ns.length ? new RegExp("(?<![\\p{L}\\p{N}-])(?:"+ns.join("|")+")(?![\\p{L}\\p{N}-])","gu") : /(?!)/g;
}
function loadDict(done){
  if(window.ES_DICT){ if(!LANG.dict) setDict(); done(true); return }
  const s = document.createElement("script"); s.src = "lang-es.js?v=1";
  s.onload = ()=>{ setDict(); done(true) }; s.onerror = ()=>done(false);
  document.head.appendChild(s);
}
// Draw everything again in the chosen language (static parts of the page included).
function applyLang(){
  document.documentElement.lang = LANG.code;
  trObs.disconnect(); try{ if(S.loaded) render(); trTree(document.body) } finally{ trObsStart() }
}
function setLang(pref){
  LS.set(KEY.lang, pref);
  const want = pref==="auto" ? (/^es\b/i.test(navigator.language||"en") ? "es" : "en") : pref;
  if(want==="es" && !LANG.dict){
    loadDict(ok=>{ if(ok){ LANG.code = "es"; applyLang() } else { LANG.code = "en"; applyLang(); toast("Could not load Spanish. Try again when you are online.") } });
  } else { LANG.code = want; applyLang() }
}
function initLang(){
  trObsStart();
  const want = resolveLang();
  if(want==="es") loadDict(ok=>{ if(ok){ LANG.code = "es"; applyLang() } });
}

/* ---------- Render ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  const v = document.getElementById("view");
  if(!S.loaded){ v.innerHTML = '<p class="empty">Loading your training log…</p>'; return }

    const base = r.builtin ? "Calisthenics · 2 alternating days" : `${r.name} · ${r.inputs.days} days a week · about ${LENGTHS[r.inputs.len].min} min`;

  }

}

function spark(ex, es, pts, label){
  es = es || entriesFor(ex); if(es.length<2) return `<div class="last">${es.length?"1 session logged":"No sessions yet"}</div>`;
  pts = pts || es.slice(-20).map(e=>score(e,ex)); const n=pts.length;
  const lo = Math.floor(Math.min(...pts)), hi = Math.ceil(Math.max(...pts)+.01);
  const W=200,H=56,P=4, x=i=>P+i*(W-2*P)/(n-1), y=v=>H-P-(v-lo)/(hi-lo||1)*(H-2*P);
  const d = pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const grid = [], gs = Math.max(1, Math.ceil((hi-lo)/5)); for(let g=lo; g<=hi; g+=gs) grid.push(`<line x1="0" x2="${W}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label || EX[ex].name)} progress over ${n} sessions">
    ${grid.join("")}
    <path d="${d} L${x(n-1)},${H-P} L${x(0)},${H-P}Z" fill="var(--accent-soft)" stroke="none"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(n-1)}" cy="${y(pts[n-1])}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}

function calendar(){
  const weeks=12, cell=16, gap=4, now=new Date(); now.setHours(12,0,0,0);
  const monday = new Date(now); monday.setDate(now.getDate()-((now.getDay()+6)%7)-7*(weeks-1));
  const by = {}; S.sessions.forEach(s=>{ const days=routineById(s.routine||"calisthenics").days; by[s.date]=days.findIndex(d=>d.id===s.day)%2===0?"A":"B" });
  let out=""; const lab=LANG.code==="es" ? ["L","M","X","J","V","S","D"] : ["M","T","W","T","F","S","S"];
  for(let r=0;r<7;r++) out+=`<text x="0" y="${22+r*(cell+gap)+12}" font-size="10" fill="var(--muted)" font-family="var(--mono)">${lab[r]}</text>`;
  for(let w=0;w<weeks;w++){
    for(let r=0;r<7;r++){
      const d=new Date(monday); d.setDate(monday.getDate()+w*7+r);
      const iso=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
      const s=by[iso], fut=d>now;
      const fill = s ? (s==="A"?"var(--accent)":"var(--chalk)") : "var(--line)";
      out+=`<rect x="${16+w*(cell+gap)}" y="${22+r*(cell+gap)}" width="${cell}" height="${cell}" rx="4" fill="${fill}" opacity="${fut?0.35:1}"><title>${iso}${s?" · Day "+s:""}</title></rect>`;
    }
    if(w%4===0){ const d=new Date(monday); d.setDate(monday.getDate()+w*7);
      out+=`<text x="${16+w*(cell+gap)}" y="12" font-size="10" fill="var(--muted)" font-family="var(--mono)">${d.toLocaleDateString(LOC(),{day:"numeric",month:"short"})}</text>` }
  }
  const W=16+weeks*(cell+gap), H=22+7*(cell+gap);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions over the last 12 weeks">${out}</svg>`;
}

function editChange(t){

  else if(t.dataset.ed==="val") e.sets[+t.dataset.i] = Math.max(0, Number(t.value)||0);
  else if(t.dataset.ed==="done") e.done[+t.dataset.i] = t.checked;
  else if(t.dataset.ed==="cfield"){ const f = t.dataset.f, v = t.value==="" ? null : Number(t.value); e[f] = v; if(f==="minutes") e.sets = [v||0] }

    // The entry is stored under alt:<id>, so the key changes with the alternative; keep its place in the list.
    const taken = Object.keys(d.entries).filter(x=>x!==k).map(altOf);

}

const EASY_ACT = {walk:["Brisk walk","Incline walk","Hike"], run:["Easy run"], machine:["Rowing machine","Swimming","Elliptical","Stair climber"]};
const HARD_ACT = {walk:["Steep incline walk"], run:["Run intervals"], machine:["Rowing machine","Stair climber","Elliptical"]};
// Interval tiers from short to long. Work and rest are in seconds.
const TIERS = [{r:6,w:30,rest:60},{r:8,w:30,rest:60},{r:10,w:30,rest:60},{r:4,w:120,rest:120},{r:4,w:180,rest:150},{r:4,w:240,rest:180}];
const fmtSec = s => s>=60 ? (s/60)+" min" : s+" s";
const tierText = t => `${t.r} × ${fmtSec(t.w)} hard, ${fmtSec(t.rest)} easy`;
const WARM_MIN = 8, COOL_MIN = 5, CARDIO_BLOCK = 4;
function cardioInfo(plan){
  const wk = Math.max(0, Math.floor((new Date() - new Date(plan.started+"T12:00:00"))/(7*864e5))), w = wk % CARDIO_BLOCK;
  return {week:wk+1, inBlock:w+1, light:w===CARDIO_BLOCK-1, wk};
}
// The interval tier for a plan this week: it starts by experience and length and climbs a step every two weeks.
function tierFor(plan, info){
  const len = plan.inputs.len, exp = plan.inputs.exp;
  const cap = {short:2, mid:4, long:5}[len], start = Math.min(cap, exp==="beginner" ? (len==="short"?0:3) : exp==="intermediate" ? ({short:1,mid:3,long:4})[len] : cap);
  const t = Math.min(cap, start + Math.floor(info.wk/2)) - (info.light ? 1 : 0);
  return TIERS[Math.max(0, t)];
}
const hrText = (age, lo, hi) => { const m = 208-0.7*age; return `about ${Math.round(m*lo)}–${Math.round(m*hi)} beats per minute (a rough estimate, with an error of around 10 or more)` };
function buildCardioPlan(inp){
  const L = CARDIO_LEN[inp.len].min, sessions = [], d = inp.days, fit = inp.goal==="fitness";
  // How many hard sessions: fitness gets one (two with five or more days and some experience); health gets one only with four or more days and some experience.
  const hard = fit ? (d>=5 && inp.exp!=="beginner" ? 2 : 1) : (d>=4 && inp.exp!=="beginner" ? 1 : 0);
  const kinds = Array(d).fill("easy");
  // Hard sessions are spaced with easy days around them: the second session, and the second-to-last when there are two.
  const hardAt = d===1 ? [0] : hard>=2 ? [1, Math.max(2,d-2)] : [1];
  hardAt.slice(0,hard).forEach(i=>{ kinds[i] = "hard" });
  // The last easy session is the longer one when there are three or more easy sessions.
  const easyIdx = kinds.map((k,i)=>k==="easy"?i:-1).filter(i=>i>=0);
  kinds.forEach((k,i)=>{ sessions.push({id:"C"+(i+1), label:"Session "+(i+1), type:k==="hard" ? "vo2" : (easyIdx.length>=3 && i===easyIdx[easyIdx.length-1] ? "long" : "easy")}) });
  const acts = [...inp.activities];
  return {
    id:"cardio", kind:"cardio", name:"Cardio", created:new Date().toISOString(), started:todayISO(), cycle:CARDIO_BLOCK,
    inputs:{days:d, len:inp.len, goal:inp.goal, exp:inp.exp, activities:acts, lowImpact:!!inp.lowImpact, age:inp.age||null},
    days:sessions.map(s=>({...s, focus:{easy:"Easy (Zone 2)", long:"Long easy", vo2:"Intervals"}[s.type]}))
  };
}
// A planned session for today: its minutes, activity options and effort.
function cardioSession(plan, day){
  const info = cardioInfo(plan), inp = plan.inputs, L = CARDIO_LEN[inp.len].min, idx = plan.days.findIndex(x=>x.id===day.id);
  const ramp = CARDIO_EXP[inp.exp].ramp && info.wk<3 ? 0.7+0.1*info.wk : 1, lightF = info.light ? 0.7 : 1;
  const run = inp.activities.includes("run") && !inp.lowImpact, pool = (k,m) => inp.activities.filter(a=>a!=="run" || (!inp.lowImpact)).flatMap(a=>m[a]||[]);
  if(day.type==="vo2"){
    const t = tierFor(plan, info), tot = WARM_MIN + Math.round(t.r*(t.w+t.rest)/60) + COOL_MIN;
    let opts = pool("hard",HARD_ACT); if(inp.exp==="beginner") opts = opts.filter(o=>o!=="Run intervals");
    if(!opts.length) opts = ["Steep incline walk"];
    return {type:"vo2", tier:t, minutes:tot, activities:opts, activity:opts[(info.wk+idx)%opts.length],
      effort:"Hard but controlled: 8–9 out of 10, where you can say only a few words. Warm up for 8 minutes, do the intervals, cool down for 5.",
      hr: inp.age ? hrText(inp.age,.9,.95) : null, text:tierText(t)};
  }
  const minutes = Math.round(L*ramp*lightF*(day.type==="long"?1.3:1)/5)*5 || 5, opts = pool("easy",EASY_ACT).length ? pool("easy",EASY_ACT) : ["Brisk walk"];
  return {type:day.type, minutes, activities:opts, activity:opts[(info.wk+idx)%opts.length],
    effort:"Easy and conversational: you can speak in full sentences, about 3–4 out of 10. If you cannot talk, slow down.",
    hr: inp.age ? hrText(inp.age,.6,.75) : null, text:`${minutes} minutes easy`};
}
// The next cardio session after the last one logged.
function nextCardioDay(plan){
  const last = [...S.sessions].reverse().find(s=>s.routine==="cardio"), i = last ? plan.days.findIndex(d=>d.id===last.day) : -1;
  return plan.days[(i+1)%plan.days.length];
}
// Weekly minutes, with moderate-equivalent minutes for the WHO range (hard work counts double).
function cardioWeek(plan){
  let easy = 0, hard = 0;
  plan.days.forEach(d=>{ const s = cardioSession(plan,d); if(d.type==="vo2"){ const w = Math.round(s.tier.r*s.tier.w/60); hard += w; easy += s.minutes - w } else easy += s.minutes });
  return {easy, hard, total:easy+hard, eq:easy+2*hard};
}
const cardioSummary = e => `${e.minutes} min ${e.activity||"cardio"}${e.rpe?` · effort ${e.rpe}/10`:""}${e.dist?` · ${e.dist} km`:""}${e.hr?` · avg HR ${e.hr}`:""}${e.rounds?` · ${e.rounds} rounds`:""}`;

// Interval timer: hard and easy periods with a short vibration at each change.
function intvPhases(t){ const ph = []; for(let i=1;i<=t.r;i++){ ph.push({name:"HARD", sec:t.w, round:i}); if(i<t.r) ph.push({name:"EASY", sec:t.rest, round:i}) } return ph }
function intvText(txt){ const el = document.getElementById("intv-text"); if(el) el.textContent = txt }
function stopIntervals(done){
  if(!INTV) return;
  const finished = INTV.rounds; clearInterval(INTV.t); INTV = null;
  if(cdraft){ cdraft.rounds = String(finished); saveCD(); const el = document.getElementById("cf-rounds"); if(el) el.value = finished }
  const b = document.querySelector('[data-act="intv"]'); if(b){ b.textContent = "▶ Start interval timer"; b.setAttribute("aria-pressed","false") }
  if(done) buzz([300,100,300,100,600]);
  intvText(done ? `Done: ${finished} rounds.` : `Stopped after ${finished} round${finished===1?"":"s"}.`);
}
function startIntervals(){
  const c = cardioToday(); if(!c || c.s.type!=="vo2") return;
  const phases = intvPhases(c.s.tier);
  INTV = {phases, i:0, end:Date.now()+phases[0].sec*1000, rounds:0, total:c.s.tier.r, t:setInterval(intvTick,250)};
  const b = document.querySelector('[data-act="intv"]'); if(b){ b.textContent = "■ Stop"; b.setAttribute("aria-pressed","true") }
  buzz(300); intvTick();
}
function intvTick(){
  if(!INTV) return;
  let left = Math.ceil((INTV.end-Date.now())/1000);
  while(left<=0){
    const ph = INTV.phases[INTV.i]; if(ph.name==="HARD") INTV.rounds = ph.round;
    INTV.i++; if(INTV.i>=INTV.phases.length){ stopIntervals(true); return }
    INTV.end += INTV.phases[INTV.i].sec*1000; left = Math.ceil((INTV.end-Date.now())/1000); buzz(INTV.phases[INTV.i].name==="HARD" ? [300] : [150,80,150]);
  }
  const ph = INTV.phases[INTV.i];
  intvText(`${ph.name} · round ${ph.round} of ${INTV.total} · ${clockText(left)}`);
}

/* ---------- Routine generator: home training ---------- */
// Rules and sources are shown in the Routine tab (EVIDENCE below). Weekly hard sets per muscle, for someone with some experience.
const GOALS = {
  general:{name:"General fitness", rest:90, effort:"Most sets 2–3 reps before failure; take the last set of each exercise to about 1 rep before failure. Rest about 90 seconds."},
  muscle:{name:"Build muscle", rest:90, effort:"Most sets 1–3 reps before failure and the last set of each exercise to 0–1. Rest 90–120 seconds. Add a rep, or a harder variation, whenever you can."},
  strength:{name:"Build strength", rest:120, effort:"Use the hardest variation you can do for 5–8 clean reps and stay 2–3 reps before failure. Rest about 2 minutes between sets."}
};
const LENGTHS = {short:{label:"short, about 30 minutes", sets:10, min:30}, mid:{label:"mid, about 45 minutes", sets:16, min:45}, long:{label:"long, 60–75 minutes", sets:22, min:65}};
const EXPERIENCE = {beginner:{name:"Beginner", mult:.75}, intermediate:{name:"Some experience", mult:1}, advanced:{name:"Advanced", mult:1.15}};
const LIMITS = {wrist:"Wrist pain", shoulder:"Shoulder pain", knee:"Knee pain", back:"Lower-back pain"};
const MUSC = ["chest","back","delts","triceps","biceps","quads","hamglute","calves","core"];
const MUSC_NAME = {chest:"Chest", back:"Back", delts:"Shoulders", triceps:"Triceps", biceps:"Biceps", quads:"Quads", hamglute:"Glutes and hamstrings", calves:"Calves", core:"Core"};
const TARGETS = {
  general:{chest:6,back:6,delts:4,triceps:3,biceps:3,quads:6,hamglute:6,calves:3,core:4},
  muscle:{chest:12,back:12,delts:8,triceps:8,biceps:8,quads:12,hamglute:10,calves:8,core:6},
  strength:{chest:6,back:6,delts:5,triceps:3,biceps:3,quads:6,hamglute:6,calves:2,core:3}
};
// The exercise that trains each muscle at home, and what it also works (a fraction of a set for each set done).
const HOME_EX = {
  chest:{ex:"pushup",also:{delts:.5,triceps:.5}}, back:{ex:"row",also:{biceps:.5}}, delts:{ex:"pike",also:{triceps:.5}},
  triceps:{ex:"dip",sub:"bench_dip",also:{chest:.5,delts:.25}}, biceps:{ex:"bicep",also:{back:.5}},
  quads:{ex:"squat",also:{hamglute:.5}}, hamglute:{ex:"hinge",also:{}}, calves:{ex:"calf",also:{}}, core:{ex:"plank",also:{}}
};
const PRIORITY = ["quads","chest","back","hamglute","delts","core","triceps","biceps","calves"];
const SPLITS = {2:["full","full"], 3:["full","full","full"], 4:["upper","lower","upper","lower"], 5:["push","pull","legs","upper","lower"], 6:["push","pull","legs","push","pull","legs"]};
const DAY_MUSCLES = {
  full:MUSC, upper:["chest","back","delts","triceps","biceps","core"], lower:["quads","hamglute","calves","core"],
  push:["chest","delts","triceps","core"], pull:["back","biceps","core","hamglute"], legs:["quads","hamglute","calves","core"]
};
const DAY_FOCUS = {full:"Full body", upper:"Upper body", lower:"Lower body", push:"Push: chest, shoulders, triceps", pull:"Pull: back, biceps, hamstrings", legs:"Legs and core"};
const SET_MIN = 2.5; // minutes per working set, rest included

function buildHomePlan(inp){
  const g = inp.goal, B = LENGTHS[inp.len].sets, C = inp.days*B, mult = EXPERIENCE[inp.exp].mult, lim = new Set(inp.limits||[]), notes = [];
  // 1. Weekly direct sets per muscle: the target, less what other exercises already give it.
  const T = {}; MUSC.forEach(m=>{ T[m] = Math.round(TARGETS[g][m]*mult) });
  const skip = new Set();
  if(lim.has("wrist") || lim.has("shoulder")) skip.add("delts");
  if(lim.has("shoulder")) skip.add("triceps");
  const direct = {};
  ["chest","back","quads","hamglute"].forEach(m=>{ direct[m] = T[m] });
  const indirect = m => Object.entries(direct).reduce((a,[k,s])=>a+((HOME_EX[k].also[m]||0)*s), 0);
  ["delts","triceps","biceps"].forEach(m=>{ const need = Math.round(T[m]-indirect(m)); direct[m] = !skip.has(m) && need>=2 ? need : 0 });
  direct.calves = T.calves>=2 ? T.calves : 0; direct.core = T.core>=2 ? T.core : 0;
  // 2. Fit the week to the time available: scale down, then drop the least important work.
  const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
  if(sum(direct) > C){ const f = C/sum(direct); MUSC.forEach(m=>{ direct[m] = Math.round(direct[m]*f) }) }
  MUSC.forEach(m=>{ if(direct[m]===1) direct[m] = 0 });
  const last = fn => [...PRIORITY].reverse().find(fn);
  // Longer sessions get more volume, up to one and a half times the target, spread over the muscles furthest below it.
  const ratio = m => (direct[m]+indirect(m))/Math.max(1,T[m]);
  while(sum(direct) < C*0.9){
    const c = PRIORITY.filter(m=>!skip.has(m) && T[m]>=2 && direct[m]+indirect(m) < T[m]*1.5).sort((a,b)=>ratio(a)-ratio(b))[0];
    if(!c) break;
    direct[c] += direct[c] ? 1 : 2;
  }
  while(sum(direct) > C){ const c = last(m=>direct[m]>2); if(c){ direct[c]--; continue } const d = last(m=>direct[m]>0); direct[d] = 0 }
  // 3. Put each muscle's sets on the days that train it, spread through the week.
  const days = SPLITS[inp.days].map((type,i)=>({id:"H"+(i+1), label:"Day "+(i+1), type, sets:{}}));
  const load = d => sum(d.sets);
  PRIORITY.forEach(m=>{
    const s = direct[m]; if(!s) return;
    const avail = days.filter(d=>DAY_MUSCLES[d.type].includes(m)); if(!avail.length) return;
    let o = Math.min(avail.length, Math.max(1, Math.min(3, Math.floor(s/2))));
    while(s/o>5 && o<avail.length) o++;
    let chosen;
    if(o>=avail.length) chosen = avail;
    else if(o===1) chosen = [avail.reduce((a,d)=>load(d)<load(a)?d:a, avail[0])];
    else chosen = Array.from({length:o}, (_,k)=>avail[Math.round(k*(avail.length-1)/(o-1))]);
    const base = Math.floor(s/o), extra = s%o;
    chosen.forEach((d,k)=>{ d.sets[m] = Math.min(6, base+(k<extra?1:0)) });
  });
  // 4. Keep each day inside its time: trim the least important work down to two sets, then drop it.
  days.forEach(d=>{ while(load(d) > B){ const c = last(m=>d.sets[m]>2); if(c){ d.sets[c]--; continue } const x = last(m=>d.sets[m]>0); delete d.sets[x] } });
  // 5. Turn sets into exercises: legs first, then push and pull in pairs, then calves and core.
  let coreN = 0;
  const itemOf = m => {
    if(m==="core") return {ex:(coreN++%2===0 || lim.has("back")) ? "plank" : "hollow"};
    const e = HOME_EX[m], it = {ex:e.ex}; if(e.sub) it.sub = e.sub;
    if(m==="chest" && lim.has("wrist")) it.sub = "fist_pushup";
    if(m==="quads" && lim.has("knee")) it.sub = "box_squat";
    return it;
  };
  const FAMILIES = [["quads","hamglute"],["chest","back","delts","biceps","triceps"],["calves","core"]];
  const dsets = {};
  days.forEach(d=>{
    const blocks = []; let pairNo = 0;
    FAMILIES.forEach(fam=>{
      const items = fam.filter(m=>d.sets[m]).map(m=>({...itemOf(m), sets:d.sets[m], muscle:m}));
      for(let i=0;i<items.length;i+=2){
        const group = items.slice(i,i+2), total = sum(group.map(x=>x.sets)), pair = group.length===2;
        group.forEach(x=>{ dsets[x.muscle] = (dsets[x.muscle]||0)+x.sets });
        blocks.push({title: pair ? "Pair "+String.fromCharCode(65+pairNo++) : "Solo", min:Math.round(total*SET_MIN), pair, items:group.map(({muscle,...it})=>it)});
      }
    });
    d.blocks = blocks; d.setCount = load(d); d.min = Math.round(5+load(d)*SET_MIN); d.focus = DAY_FOCUS[d.type];
  });
  // 6. The weekly picture: what each muscle really gets.
  const weekly = {};
  MUSC.forEach(m=>{
    const ind = Object.entries(dsets).reduce((a,[k,s])=>a+((HOME_EX[k].also[m]||0)*s), 0);
    weekly[m] = {direct:dsets[m]||0, indirect:Math.round(ind*2)/2, target:T[m]};
  });
  const below = MUSC.filter(m=>weekly[m].direct+weekly[m].indirect < 0.8*weekly[m].target);
  if(below.length){
    const missing = Math.round(below.reduce((a,m)=>a+weekly[m].target-weekly[m].direct-weekly[m].indirect, 0));
    notes.push(`The time you chose does not fit the full ${GOALS[g].name.toLowerCase()} volume: ${below.map(m=>`${MUSC_NAME[m].toLowerCase()} ${Math.round(weekly[m].direct+weekly[m].indirect)} of ${weekly[m].target}`).join(", ")} weekly sets. About ${missing} more sets a week, roughly ${Math.round(missing*SET_MIN)} more minutes, would close the gap: longer sessions or another day.`);
  }
  if(!weekly.biceps.direct && weekly.biceps.indirect) notes.push("Biceps get their work from the rows; there is no separate biceps exercise at this volume.");
  if(skip.has("delts")) notes.push("Overhead pike push-ups were left out because of the pain you noted. Shoulders still get indirect work from push-ups.");
  if(skip.has("triceps")) notes.push("Chair dips were left out because of shoulder pain. Triceps still work in push-ups.");

  if(lim.has("knee")) notes.push("Squats are chair squats at a depth that does not hurt.");
  if(lim.has("back")) notes.push("Core work is planks only, and the glute bridges stay the easiest level until they feel fine.");

    id:"home", name:"Home training", created:new Date().toISOString(), inputs:{days:inp.days, len:inp.len, goal:inp.goal, exp:inp.exp, limits:[...(inp.limits||[])]},

    days:days.map(({id,label,focus,blocks,setCount,min})=>({id,label,focus,blocks,setCount,min}))
  };

const WARMUP_GYM = ["5 minutes of easy cardio to warm up","Arm circles, leg swings and hip circles (1–2 minutes)","Before the first lift: 1 × 8 at about 50% of the working weight, then 1 × 5 at about 70%","Before each later lift: one light set of 6–8 reps"];
const GYM_REPS = {strength:{compound:[3,6], iso:[8,12]}, muscle:{compound:[6,12], iso:[10,20]}, general:{compound:[8,15], iso:[10,15]}};
const GYM_REST = {strength:180, muscle:120, general:120};
const GYM_EFFORT = {

// Which patterns serve each muscle, and in what share, by goal.
const GYM_POLICY = {
  muscle:{chest:[["hpush",.7],["fly",.3]], back:[["hpull",.5],["vpull",.5]], delts:[["vpush",.45],["lateral",.35],["rear",.2]], triceps:[["triceps",1]], biceps:[["biceps",1]], quads:[["squat",.5],["unilat",.25],["legext",.25]], hamglute:[["hinge",.55],["legcurl",.45]], calves:[["calves",1]], core:[["core",1]]},
  general:{chest:[["hpush",1]], back:[["hpull",.5],["vpull",.5]], delts:[["vpush",1]], triceps:[["triceps",1]], biceps:[["biceps",1]], quads:[["squat",.7],["unilat",.3]], hamglute:[["hinge",1]], calves:[["calves",1]], core:[["core",1]]},
  strength:{chest:[["hpush",1]], back:[["hpull",.5],["vpull",.5]], delts:[["vpush",1]], triceps:[["triceps",1]], biceps:[["biceps",1]], quads:[["squat",1]], hamglute:[["hinge",1]], calves:[["calves",1]], core:[["core",1]]}
};
const SLOT_ORDER = ["squat","hinge","hpush","hpull","vpull","vpush","unilat","legext","legcurl","fly","lateral","rear","triceps","biceps","calves","core"];
const SLOT_PRIORITY = ["squat","hpush","hpull","hinge","vpull","vpush","unilat","triceps","biceps","lateral","legext","legcurl","fly","rear","calves","core"];
const slotCost = s => GYM.slots[s].kind==="compound" ? 3 : 2;
const slotCap = s => GYM.slots[s].kind==="compound" ? 5 : 4;
const slotMuscle = s => GYM.slots[s].main;
// A day trains a slot when it trains the slot's muscle (rear delts also go on back days).
const slotOnDay = (s, type) => DAY_MUSCLES[type].includes(slotMuscle(s)) || (s==="rear" && DAY_MUSCLES[type].includes("back"));

function buildGymPlan(inp){
  const g = inp.goal, Bm = LENGTHS[inp.len].min-8, C = inp.days*Bm, mult = EXPERIENCE[inp.exp].mult, notes = [];
  const equip = new Set([...inp.equip, "body"]);
  const slotOK = s => GYM.slots[s].moves.some(id=>equip.has(GYM.moves[id].eq));
  // 1. Weekly direct sets per muscle: the target less what other lifts already give it.
  const T = {}; MUSC.forEach(m=>{ T[m] = Math.round(TARGETS[g][m]*mult) });
  const policy = GYM_POLICY[g];
  const usable = m => policy[m].filter(([s])=>slotOK(s));
  const direct = {};
  ["chest","back","quads","hamglute"].forEach(m=>{ direct[m] = usable(m).length ? T[m] : 0 });
  const slotMain = {chest:"hpush", back:"hpull", delts:"vpush", quads:"squat", hamglute:"hinge"};
  const indirect = m => Object.entries(direct).reduce((a,[k,s])=>{ const sl = (policy[k]||[]).map(x=>x[0]); return a + s*(sl.reduce((q,x)=>q+((GYM.slots[x].also[m]||0)*(policy[k].find(y=>y[0]===x)[1])),0)) }, 0);
  const floorMin = (m) => g==="muscle" && ["triceps","biceps","calves","core"].includes(m) ? 4 : 2;
  ["delts","triceps","biceps"].forEach(m=>{ const need = Math.round(T[m]-indirect(m)); direct[m] = usable(m).length && (need>=2 || floorMin(m)>2) ? Math.max(need, floorMin(m)>2?floorMin(m):0) : 0 });
  direct.calves = usable("calves").length && T.calves>=2 ? Math.max(T.calves, floorMin("calves")>2?4:0) : 0;
  direct.core = usable("core").length && T.core>=2 ? Math.max(T.core, floorMin("core")>2?4:0) : 0;
  // 2. Fit the week to the minutes available; longer sessions get more volume, up to 1.5 times the target.
  const sum = o => Object.values(o).reduce((a,b)=>a+b,0), Cs = C/2.7;
  if(sum(direct) > Cs){ const f = Cs/sum(direct); MUSC.forEach(m=>{ direct[m] = Math.round(direct[m]*f) }) }
  MUSC.forEach(m=>{ if(direct[m]===1) direct[m] = 0 });
  const lastM = fn => [...["calves","biceps","triceps","core","delts","hamglute","back","chest","quads"]].find(fn);
  while(sum(direct) > Cs){ const c = lastM(m=>direct[m]>2); if(c){ direct[c]--; continue } const d = lastM(m=>direct[m]>0); direct[d] = 0 }
  const ratio = m => (direct[m]+indirect(m))/Math.max(1,T[m]);
  const order = ["quads","chest","back","hamglute","delts","core","triceps","biceps","calves"];
  while(sum(direct) < Cs*0.9){
    const c = order.filter(m=>usable(m).length && T[m]>=2 && direct[m]+indirect(m) < T[m]*1.5).sort((a,b)=>ratio(a)-ratio(b))[0];
    if(!c) break;
    direct[c] += direct[c] ? 1 : 2;
  }
  // 3. Share each muscle's sets between its patterns (largest remainder), merging tiny shares into the main pattern.
  const slotSets = {};
  MUSC.forEach(m=>{
    const s = direct[m]; if(!s) return;
    const list = usable(m), tot = list.reduce((a,[,sh])=>a+sh,0);
    const raw = list.map(([sl,sh])=>[sl, s*sh/tot]); const fl = raw.map(([sl,v])=>[sl,Math.floor(v),v-Math.floor(v)]);
    let left = s - fl.reduce((a,x)=>a+x[1],0); fl.sort((a,b)=>b[2]-a[2]).forEach(x=>{ if(left>0){ x[1]++; left-- } });
    const main = list[0][0], res = {};
    fl.forEach(([sl,n])=>{ res[sl] = n });
    list.forEach(([sl])=>{ if(sl!==main && res[sl]===1){ res[sl] = 0; res[main]++ } });
    list.forEach(([sl])=>{ if(res[sl]>0) slotSets[sl] = (slotSets[sl]||0)+res[sl] });
  });
  // 4. Put each pattern on the days that train it, spread through the week.
  const days = SPLITS[inp.days].map((type,i)=>({id:"G"+(i+1), label:"Day "+(i+1), type, sets:{}}));
  const mins = d => Object.entries(d.sets).reduce((a,[s,n])=>a+n*slotCost(s), 0);
  SLOT_PRIORITY.forEach(sl=>{
    const s = slotSets[sl]; if(!s) return;
    const avail = days.filter(d=>slotOnDay(sl,d.type)); if(!avail.length) return;
    let o = Math.min(avail.length, Math.max(1, Math.min(3, Math.floor(s/2))));
    while(s/o>slotCap(sl) && o<avail.length) o++;
    let chosen;
    if(o>=avail.length) chosen = avail;
    else if(o===1) chosen = [avail.reduce((a,d)=>mins(d)<mins(a)?d:a, avail[0])];
    else chosen = Array.from({length:o}, (_,k)=>avail[Math.round(k*(avail.length-1)/(o-1))]);
    const base = Math.floor(s/o), extra = s%o;
    chosen.forEach((d,k)=>{ d.sets[sl] = Math.min(slotCap(sl), base+(k<extra?1:0)) });
  });
  // 5. Keep each day inside its time: trim the least important work down to two sets, then drop it.
  const lastS = (d,fn) => [...SLOT_PRIORITY].reverse().find(s=>d.sets[s] && fn(s));
  days.forEach(d=>{ while(mins(d) > Bm){ const c = lastS(d, s=>d.sets[s]>2); if(c){ d.sets[c]--; continue } const x = lastS(d, ()=>true); delete d.sets[x] } });
  // A day with nothing to train (for example a leg day with only cable machines) is left out and the rest renumbered.
  const kept = days.filter(d=>mins(d)>0);
  if(kept.length < days.length){
    notes.push(`${days.length-kept.length} of the ${days.length} days had nothing to train with the equipment you chose, so the plan has ${kept.length} days. Add machines or dumbbells to get the full week.`);
    days.length = 0; kept.forEach((d,i)=>{ d.id = "G"+(i+1); d.label = "Day "+(i+1); days.push(d) });
  }
  // 6. Turn patterns into ordered lifts with rep ranges.
  const reps = GYM_REPS[g], dsets = {};
  days.forEach(d=>{
    const items = SLOT_ORDER.filter(s=>d.sets[s]).map(s=>({gym:true, slot:s, kind:GYM.slots[s].kind, sets:d.sets[s], reps:reps[GYM.slots[s].kind]}));
    let firstCompound = true;
    d.blocks = items.map(it=>{ const title = it.kind==="compound" ? (firstCompound ? (firstCompound=false, "Main lift") : "Compound lift") : "Accessory";
      dsets[it.slot] = (dsets[it.slot]||0)+it.sets; return {title, min:it.sets*slotCost(it.slot), pair:false, items:[it]} });
    d.setCount = items.reduce((a,x)=>a+x.sets,0); d.min = Math.round(8+mins(d)); d.focus = DAY_FOCUS[d.type];
  });
  // 7. The weekly picture.
  const weekly = {};
  MUSC.forEach(m=>{
    let dir = 0, ind = 0;
    Object.entries(dsets).forEach(([sl,n])=>{ if(slotMuscle(sl)===m) dir += n; ind += n*(GYM.slots[sl].also[m]||0) });
    weekly[m] = {direct:dir, indirect:Math.round(ind*2)/2, target:T[m]};
  });
  const below = MUSC.filter(m=>weekly[m].direct+weekly[m].indirect < 0.8*weekly[m].target);
  if(below.length){
    const missing = Math.round(below.reduce((a,m)=>a+weekly[m].target-weekly[m].direct-weekly[m].indirect, 0));
    notes.push(`The time you chose does not fit the full ${GOALS[g].name.toLowerCase()} volume: ${below.map(m=>`${MUSC_NAME[m].toLowerCase()} ${Math.round(weekly[m].direct+weekly[m].indirect)} of ${weekly[m].target}`).join(", ")} weekly sets. About ${missing} more sets a week, roughly ${Math.round(missing*2.7)} more minutes, would close the gap: longer sessions or another day.`);
  }
  const noSlot = SLOT_ORDER.filter(s=>!slotOK(s) && MUSC.some(m=>(policy[m]||[]).some(([x])=>x===s)));
  if(noSlot.length) notes.push(`No movement is available for ${noSlot.map(s=>GYM.slots[s].name.toLowerCase()).join(", ")} with the equipment you chose, so that work is left out.`);
  if(!weekly.biceps.direct && weekly.biceps.indirect) notes.push("Biceps get their work from the rows and pulldowns; there is no separate curl at this volume.");
  if(!weekly.triceps.direct && weekly.triceps.indirect) notes.push("Triceps get their work from the presses; there is no separate triceps exercise at this volume.");
  notes.push(`Each block is ${GYM_BLOCK-1} weeks of training and one lighter week. Weights progress with double progression, and the movement for each pattern rotates every block (you can swap any time).`);
  return {
    id:"gym", kind:"gym", name:"Gym training", created:new Date().toISOString(), started:todayISO(), cycle:GYM_BLOCK, picks:{}, base:{},
    equip:[...inp.equip], inputs:{days:days.length, len:inp.len, goal:inp.goal, exp:inp.exp, limits:[], equip:[...inp.equip]},
    rest:GYM_REST[g], effort:GYM_EFFORT[g], warmup:WARMUP_GYM, weekly, notes,
    days:days.map(({id,label,focus,blocks,setCount,min})=>({id,label,focus,blocks,setCount,min}))
  };
}

let toastT;
function toast(msg, ms=4500){ const t=document.getElementById("toast"); t.innerHTML=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,ms) }

async function finish(){
  const deload=isDeload(), ups=[], entries={};
  Object.entries(draft.entries).forEach(([ex,e])=>{
    if(!e.done.some(Boolean)) return;
    if(e.gym){ entries["g:"+e.move] = {gym:true, slot:e.slot, sets:e.sets.map(Number), loads:e.loads.map(Number), done:e.done.slice()}; return }
    if(e.sub){
      const key = entries["alt:"+e.sub] ? `alt:${e.sub}:${ex}` : "alt:"+e.sub;
      entries[key]={level:0, sets:e.sets.map(Number), done:e.done.slice(), subFor:ex};
      return;
    }
    entries[ex]={level:e.level, sets:e.sets.map(Number), done:e.done.slice()};
    const L=lv(ex,e.level);
    if(!deload && e.done.every(Boolean) && e.sets.every(v=>Number(v)>=L.max) && e.level<EX[ex].levels.length-1){ ups.push(ex) }
  });
  const s={id:"s"+Date.now(), date:draft.date, ts:Date.now(), routine:S.routine, day:draft.day, warmup:draft.warm.filter(Boolean).length, entries, levelUps:ups};
  try{
    await saveSession(s);
    if(ups.length){ ups.forEach(ex=>S.levels[ex]=S.levels[ex]+1); await saveLevels() }
  }catch(e){ toast("Could not save the session on this phone. Free some space or save a backup, then press Finish again."); return }
  draft=null; LS.set(KEY.draft,null); day=null;
  toast(ups.length ? `<b>Session saved.</b> Level-up: ${ups.map(ex=>esc(EX[ex].name)+" → "+esc(lv(ex,S.levels[ex]).name)).join("; ")}.` : "<b>Session saved.</b> Same levels next time; aim for one more rep or a few more seconds.");
  render();
  if(backupDue()) await autoBackup();
}

/* ---------- Rest timer and hold timer ---------- */
const buzz = p => { try{ if(navigator.vibrate) navigator.vibrate(p) }catch(e){} };
const REST_LENGTHS = [60,90,120,180];
const rest = {len: REST_LENGTHS.includes(LS.get("gravity-log:rest",90)) ? LS.get("gravity-log:rest",90) : 90};
const clockText = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
let tEnd=0, tInt=null;
function showRestLen(){
  document.getElementById("tstart").textContent = `Rest ${rest.len} s`;
  document.getElementById("tlen").textContent = `${rest.len} s`;
  document.querySelectorAll(".restn").forEach(el=>el.textContent = rest.len);
}
function startTimer(){ tEnd=Date.now()+rest.len*1000; document.getElementById("treset").hidden=false; clearInterval(tInt); tInt=setInterval(tick,250); tick() }
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000)), clock=document.getElementById("tclock");
  clock.textContent = clockText(left);
  if(!left){ clearInterval(tInt); clock.textContent="Go"; buzz([200,100,200,100,400]) }
}
function resetClock(){ clearInterval(tInt); document.getElementById("tclock").textContent = clockText(rest.len); document.getElementById("treset").hidden=true }
document.getElementById("tstart").onclick=startTimer;
document.getElementById("treset").onclick=resetClock;
document.getElementById("tlen").onclick=()=>{
  rest.len = REST_LENGTHS[(REST_LENGTHS.indexOf(rest.len)+1)%REST_LENGTHS.length]; LS.set("gravity-log:rest", rest.len);
  showRestLen(); if(document.getElementById("treset").hidden) document.getElementById("tclock").textContent = clockText(rest.len);
};
showRestLen(); document.getElementById("tclock").textContent = clockText(rest.len);

// Hold timer: counts up while you hold; Stop writes the seconds into that set. It buzzes once when you pass the top of the range.
let HOLD = null;
const holdElapsed = () => HOLD ? Math.max(0, Math.round((Date.now()-HOLD.t0)/1000)) : 0;
function holdBtn(){ return HOLD && document.querySelector(`[data-act="hold"][data-ex="${HOLD.ex}"][data-i="${HOLD.i}"]`) }
function toggleHold(ex, i){
  if(HOLD && !holdRunning(ex,i)) stopHold();
  if(holdRunning(ex,i)){ stopHold(); return }
  const e = draft.entries[ex], sp = spec(ex,e);
  HOLD = {ex, i, t0:Date.now(), max:sp.max, buzzed:false, int:setInterval(holdTick,250)};
  holdTick();
}
function holdTick(){
  const b = holdBtn(); if(!HOLD) return;
  const s = holdElapsed();
  if(b){ b.classList.add("on"); b.textContent = `■ ${s} s`; b.setAttribute("aria-label","Stop the hold timer") }
  if(!HOLD.buzzed && s>=HOLD.max){ HOLD.buzzed = true; buzz(300) }
}
function stopHold(){
  if(!HOLD) return;
  const {ex,i,int} = HOLD, s = Math.max(1, holdElapsed()); clearInterval(int); HOLD = null;
  const e = draft && draft.entries[ex]; if(!e) return;
  e.sets[i] = s; saveDraft();
  const inp = document.getElementById(`v-${ex}-${i}`); if(inp) inp.value = s;
  const b = document.querySelector(`[data-act="hold"][data-ex="${ex}"][data-i="${i}"]`);
  if(b){ b.classList.remove("on"); b.textContent = "▶"; b.setAttribute("aria-label",`Start the hold timer for set ${i+1}`) }
  refreshProgress(ex);
}

render();
initStore();
initLang();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}) }
</script>
