<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gravity Log</title>
<meta name="theme-color" content="#2F45C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gravity Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow training column, three tabs (Train / Progress / Program), phone-first. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#18201D; --muted:#5B6661; --line:#D5DCD9;
  --accent:#2F45C8; --accent-ink:#FFFFFF; --accent-soft:#E3E7FB;
  --chalk:#B7791F; --chalk-soft:#F6EBD9; --good:#1F7A4D; --good-soft:#DDF1E6; --warn:#A8521E; --warn-soft:#F8E4D8;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A211E; --ink:#E7EDEA; --muted:#9AA6A0; --line:#2C3632;
  --accent:#8C9CFF; --accent-ink:#0E1330; --accent-soft:#232A52;
  --chalk:#E2B05E; --chalk-soft:#3A2F1C; --good:#5CC98F; --good-soft:#173A28; --warn:#F0A070; --warn-soft:#41291B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A211E; --ink:#E7EDEA; --muted:#9AA6A0; --line:#2C3632;
  --accent:#8C9CFF; --accent-ink:#0E1330; --accent-soft:#232A52;
  --chalk:#E2B05E; --chalk-soft:#3A2F1C; --good:#5CC98F; --good-soft:#173A28; --warn:#F0A070; --warn-soft:#41291B; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-size:1rem;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:.85rem}
.store{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
nav.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .9rem var(--body);padding:10px 6px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border-radius:12px;padding:12px 14px;font-size:.9rem}
.banner.deload{background:var(--chalk-soft);color:var(--ink);border:1px solid var(--chalk)}
.banner.info{background:var(--accent-soft)}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.block-h .min{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.pair{grid-template-columns:1fr}}
.ex-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pattern{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lvl{font-family:var(--mono);font-size:.72rem;color:var(--accent);white-space:nowrap}
.cue{font-size:.85rem;color:var(--muted)}
.target{font-family:var(--mono);font-size:.8rem}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.set .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);width:3.2em}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
.step button{border:0;background:var(--bg);color:var(--ink);width:38px;height:38px;font-size:1.1rem;cursor:pointer}
.step input{width:56px;height:38px;border:0;border-inline:1px solid var(--line);text-align:center;font:500 1rem var(--mono);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.step input::-webkit-inner-spin-button{appearance:none}
.unit{font-size:.75rem;color:var(--muted);margin-left:6px}
.tick{width:42px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.hit{color:var(--good);font-weight:600}
.checklist{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);font-size:.9rem;width:100%}
.check .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem}
.check[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.check[aria-pressed="true"] span.t{color:var(--muted);text-decoration:line-through}
.finish{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;font-size:.95rem}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--warn);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.up{background:var(--chalk-soft);color:var(--chalk)}
.pill.stall{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:800 1.9rem var(--display);line-height:1}
.stat span{font-size:.75rem;color:var(--muted)}
.cal{overflow-x:auto}
.cal svg{display:block;min-width:300px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.ladder i.on{background:var(--accent)}
.spark{width:100%;height:56px;display:block}
.last{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.lv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lv-list li{display:grid;grid-template-columns:2em 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:.88rem}
.lv-list li.cur{background:var(--accent-soft)}
.lv-list li .k{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.lv-list li .r{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.lv-list button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:.72rem;cursor:pointer}
.prose{max-width:65ch;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.hist .meta{font-family:var(--mono);font-size:.78rem}
.timer{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:6px;align-items:center;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer b{font:500 1rem var(--mono);min-width:3.2em;text-align:center}
.timer button{border:0;border-radius:99px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.timer button.alt{background:transparent;color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:20;max-width:min(92vw,460px);font-size:.9rem}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.data-actions{display:flex;gap:8px;flex-wrap:wrap}
.banner.backup{background:var(--warn-soft);border:1px solid var(--warn)}
@media (prefers-reduced-motion:no-preference){nav.tabs button,.tick,.check .box{transition:background .15s,color .15s}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Gravity Log</h1>
      <div class="sub">Full-body calisthenics, 3 sessions a week, about 45 minutes</div>
    </div>
    <div class="store" id="store">Loading…</div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-train" aria-selected="true" data-tab="train">Train</button>
    <button role="tab" id="tab-progress" aria-selected="false" data-tab="progress">Progress</button>
    <button role="tab" id="tab-program" aria-selected="false" data-tab="program">Program</button>
  </nav>

  <main id="view"></main>
</div>

<div class="timer" id="timer">
  <b id="tclock">1:30</b>
  <button id="tstart" type="button">Rest 90 s</button>
  <button id="treset" class="alt" type="button" hidden>Stop</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Program definition ---------- */
const EX = {
  handstand:{name:"Handstand",pattern:"Skill · balance",unit:"s",levels:[
    ["Wall plank","Feet on the wall at hip height, hands under shoulders, body straight. Push the floor away.",15,30],
    ["Chest-to-wall handstand","Walk up until your chest faces the wall, hands 10–20 cm from it. Ribs in, shoulders pushed up to the ears.",20,45],
    ["Chest-to-wall, long hold","Same position, longer. Practise lifting one foot off the wall for a moment.",30,60],
    ["Toe pulls off the wall","Back to the wall. Pull your feet off and balance with your fingers.",5,15],
    ["Freestanding kick-up","Kick up in open space and hold any balance. Bail by turning out to the side.",3,10],
    ["Freestanding handstand","Straight line; correct with fingers (falling forward) and palms (falling back).",10,30],
    ["Freestanding handstand, long","Same, building toward a minute.",30,60]]},
  pullup:{name:"Pull-up",pattern:"Vertical pull",unit:"reps",levels:[
    ["Scapular pulls","Dead hang, then pull the shoulder blades down without bending the elbows.",5,10],
    ["Negative pull-ups","Jump to chin over bar, lower yourself in 5 seconds.",3,5],
    ["Pull-ups","Full hang to chin over bar. No kipping.",3,8],
    ["Chest-to-bar pull-ups","Pull higher, until the bar touches the upper chest.",4,8],
    ["Archer pull-ups","Wide grip; pull toward one hand while the other arm straightens. Reps per side.",3,6],
    ["Typewriter pull-ups","Pull up, slide side to side at the top. Reps per side.",3,6],
    ["One-arm negatives","Pull up with two arms, lower on one in 5 s. Reps per side.",2,4],
    ["One-arm pull-up","Reps per side.",1,3]]},
  dip:{name:"Dip",pattern:"Vertical push · dips",unit:"reps",levels:[
    ["Support hold","Straight arms on parallel bars or two sturdy chairs, shoulders pushed down.",10,30],
    ["Negative dips","Start at the top, lower in 5 seconds to about 90° at the elbow.",3,5],
    ["Dips","Shoulders a little below elbows at the bottom, lock out at the top.",3,8],
    ["Paused dips","Two-second pause at the bottom.",5,8],
    ["Weighted dips","Backpack with books or water bottles.",5,8]]},
  pushup:{name:"Push-up",pattern:"Horizontal push",unit:"reps",levels:[
    ["Incline push-ups","Hands on a chair or table edge, body straight.",8,15],
    ["Push-ups","Chest to the floor, elbows about 45° from the body.",5,12],
    ["Parallette push-ups","Hands on the parallettes for a deeper range.",5,10],
    ["Diamond push-ups","Hands together under the chest.",5,10],
    ["Pseudo-planche push-ups","Hands by the hips, fingers turned out, lean forward over the hands.",5,8],
    ["Archer push-ups","Shift onto one arm while the other straightens. Reps per side.",4,8],
    ["Incline one-arm push-ups","One hand on a chair, feet wide. Reps per side.",3,6],
    ["One-arm push-up","Reps per side.",2,5]]},
  row:{name:"Row",pattern:"Horizontal pull",unit:"reps",levels:[
    ["Incline rows","Under a sturdy table edge or a low bar, body at about 45°, pull chest to the edge.",8,12],
    ["Horizontal rows","Body nearly horizontal, heels on the floor.",5,10],
    ["Feet-elevated rows","Feet on a chair so the body is level.",5,10],
    ["Archer rows","Pull toward one hand, other arm straight. Reps per side.",4,8],
    ["Tuck front lever rows","From a tuck front lever, pull the bar to the hips.",3,6],
    ["Advanced tuck front lever rows","Back flat, knees at hip level.",3,6]]},
  pike:{name:"Overhead press",pattern:"Overhead push",unit:"reps",levels:[
    ["Pike push-ups","Hips high, head goes in front of the hands.",5,10],
    ["Parallette pike push-ups","Hands on parallettes for more depth.",5,10],
    ["Feet-elevated pike push-ups","Feet on a chair, hips over hands.",5,8],
    ["Wall handstand push-up negatives","Lower from a wall handstand in 5 s to the head.",3,5],
    ["Wall HSPU, partial range","Lower to a cushion or folded mat and press back up.",3,6],
    ["Wall handstand push-ups","Head to the floor and back up.",3,8],
    ["Deficit wall HSPU","Hands on parallettes, lower below hand level.",3,6]]},
  frontlever:{name:"Front lever",pattern:"Straight-arm pull",unit:"s",levels:[
    ["Active hang","Hang with shoulders pulled down and back, arms straight.",15,30],
    ["Tuck front lever","Knees to chest, back horizontal, arms straight.",8,20],
    ["Advanced tuck front lever","Back flat, knees at hip level.",8,20],
    ["One-leg front lever","One leg straight, the other tucked. Alternate sets.",8,20],
    ["Straddle front lever","Legs wide and straight.",6,15],
    ["Front lever","Body straight and horizontal.",5,15]]},
  planche:{name:"Planche",pattern:"Straight-arm push",unit:"s",levels:[
    ["Planche lean","On the parallettes, straight arms, lean forward until shoulders pass the hands.",15,30],
    ["Frog stand","Knees on the backs of the elbows, balance on the hands.",15,30],
    ["Tuck planche","Straight arms, knees tucked, hips at shoulder height.",8,20],
    ["Advanced tuck planche","Back flat, knees away from the chest.",8,20],
    ["Straddle planche","Legs wide and straight.",5,15],
    ["Planche","Body straight and horizontal.",5,10]]},
  lsit:{name:"L-sit",pattern:"Compression",unit:"s",levels:[
    ["Foot-assisted L-sit","On the parallettes, heels on the floor, lift the hips and push the shoulders down.",10,30],
    ["Tuck L-sit","Knees to chest, feet off the floor.",10,30],
    ["One-leg L-sit","One leg straight, one tucked. Alternate sets.",10,20],
    ["L-sit","Both legs straight and level with the hips.",10,20],
    ["V-sit","Legs raised above horizontal.",5,15]]},
  hollow:{name:"Hollow hold",pattern:"Core · anterior",unit:"s",levels:[
    ["Tuck hollow hold","Lower back pressed down, knees bent toward the chest.",20,40],
    ["Hollow hold, arms by hips","Legs straight and low, lower back still down.",20,40],
    ["Hollow hold, arms overhead","Biceps by the ears.",20,40],
    ["Hollow hold, long","Arms overhead, building to a minute.",40,60]]},
  legraise:{name:"Hanging leg raise",pattern:"Core · hanging",unit:"reps",levels:[
    ["Hanging knee raises","Knees to chest, no swinging.",6,12],
    ["Bent-leg raises","Knees soft, raise legs to hip height.",5,10],
    ["Straight-leg raises","Legs straight to horizontal.",5,10],
    ["Toes-to-bar","Raise until the toes touch the bar.",5,10],
    ["Windshield wipers","Legs up, rotate side to side. Reps per side.",3,6]]},
  squat:{name:"Squat",pattern:"Legs · squat",unit:"reps",levels:[
    ["Bodyweight squats","Full depth, heels down.",15,25],
    ["Split squats","Back knee to the floor. Reps per leg.",8,12],
    ["Bulgarian split squats","Rear foot on a chair. Reps per leg.",6,12],
    ["Assisted shrimp squats","Hold a door frame, back knee to the floor. Reps per leg.",5,8],
    ["Shrimp squats","Unassisted. Reps per leg.",5,8],
    ["Assisted pistol squats","Hold a door frame. Reps per leg.",5,8],
    ["Pistol squats","Reps per leg.",3,8]]},
  hinge:{name:"Hip hinge",pattern:"Legs · posterior",unit:"reps",levels:[
    ["Glute bridges","Squeeze at the top for a second.",12,20],
    ["Single-leg glute bridges","Reps per leg.",8,12],
    ["Single-leg hip thrusts","Shoulders on a sofa or chair. Reps per leg.",8,12],
    ["Nordic curl negatives","Feet anchored under a sofa, lower in 5 s, catch with hands.",3,6],
    ["Nordic curls","Lower and pull back up.",3,6]]}
};
const START = {handstand:0,pullup:2,dip:2,pushup:1,row:0,pike:0,frontlever:0,planche:0,lsit:0,hollow:0,legraise:0,squat:1,hinge:1};
const DAYS = {
  A:{label:"Day A",focus:"Vertical pull and push, straight-arm work, squat",pairs:[["pullup","dip"],["frontlever","planche"],["squat","hollow"]]},
  B:{label:"Day B",focus:"Horizontal pull and push, compression, overhead, hinge",pairs:[["row","pushup"],["lsit","pike"],["hinge","legraise"]]}
};
const WARMUP = ["Wrist circles, palm and back-of-hand stretches (1 min)","Arm circles and shoulder dislocates with a towel (1 min)","Scapular push-ups ×10","Scapular pulls on the bar ×8","Hollow and arch rocks (30 s each)","Bodyweight squats ×10"];
const SETS = 3, DELOAD_EVERY = 6;

/* ---------- Storage: this device only (localStorage), with backup export/import ---------- */
const KEY = {data:"gravity-log:data", draft:"gravity-log:draft", backup:"gravity-log:last-backup"};
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const S = {levels:{...START}, sessions:[], loaded:false, persistent:null};
let tab = "train", day = null, draft = LS.get(KEY.draft, null);

function setStore(t){document.getElementById("store").textContent=t}

async function initStore(){
  const l = LS.get(KEY.data, null);
  if(l){ S.levels = {...START, ...l.levels}; S.sessions = (l.sessions || []).sort((a,b)=>a.ts-b.ts) }
  S.loaded = true; setStore("Saved on this phone"); render();
  // Ask the browser not to evict this site's storage (granted silently for installed apps in most browsers).
  try{
    if(navigator.storage && navigator.storage.persisted){
      S.persistent = await navigator.storage.persisted();
      if(!S.persistent && navigator.storage.persist) S.persistent = await navigator.storage.persist();
    }
  }catch(e){}
  render();
}
function saveLocal(){ if(!LS.set(KEY.data,{levels:S.levels,sessions:S.sessions})) throw new Error("storage") }
async function saveLevels(){ saveLocal() }
async function saveSession(s){ S.sessions.push(s); saveLocal() }
async function deleteSession(id){ S.sessions = S.sessions.filter(s=>s.id!==id); saveLocal() }

/* Backups: a full JSON file to restore, and a CSV (one row per set) to analyse on a PC. */
function backupObject(){ return {app:"gravity-log", format:1, exported:new Date().toISOString(), levels:S.levels, sessions:S.sessions} }
function csvText(){
  const rows=[["date","day","exercise","pattern","level","level_name","set","value","unit","done"]];
  S.sessions.forEach(s=>Object.entries(s.entries||{}).forEach(([ex,e])=>{
    if(!EX[ex]) return;
    e.sets.forEach((v,i)=>rows.push([s.date,s.day,EX[ex].name,EX[ex].pattern,e.level+1,EX[ex].levels[e.level][0],i+1,v,EX[ex].unit,e.done[i]?1:0]));
  }));
  return rows.map(r=>r.map(c=>{const t=String(c);return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}).join(",")).join("\n");
}
async function deliver(text, type, name){
  const file = new File([text], name, {type});
  // On phones the share sheet lets you save to Files/Drive or send by email; elsewhere download directly.
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return true }catch(e){ if(e && e.name==="AbortError") return false }
  }
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  return true;
}
async function exportBackup(){
  const ok = await deliver(JSON.stringify(backupObject(),null,1), "application/json", `gravity-log-backup-${todayISO()}.json`);
  if(ok){ LS.set(KEY.backup, new Date().toISOString()); toast("<b>Backup saved.</b> Keep the file somewhere off this phone, such as your PC or cloud drive."); render() }
}
async function exportCSV(){ await deliver(csvText(), "text/csv", `gravity-log-sets-${todayISO()}.csv`) }
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let b; try{ b = JSON.parse(r.result) }catch(e){ toast("That file is not a Gravity Log backup (it isn't valid JSON)."); return }
    if(!b || b.app!=="gravity-log" || !Array.isArray(b.sessions)){ toast("That file is not a Gravity Log backup."); return }
    const have = new Set(S.sessions.map(s=>s.id));
    const added = b.sessions.filter(s=>s && s.id && !have.has(s.id));
    const backupNewest = Math.max(0,...b.sessions.map(s=>s.ts||0)), localNewest = Math.max(0,...S.sessions.map(s=>s.ts||0));
    S.sessions = S.sessions.concat(added).sort((a,b)=>a.ts-b.ts);
    if(b.levels && backupNewest >= localNewest) S.levels = {...START, ...b.levels};
    try{ saveLocal() }catch(e){ toast("Could not save the imported data on this phone."); return }
    draft = null; LS.set(KEY.draft, null);
    toast(`<b>Backup imported.</b> ${added.length} session${added.length===1?"":"s"} added; ${b.sessions.length-added.length} already here.`);
    render();
  };
  r.readAsText(file);
}
function lastBackupDays(){ const t=LS.get(KEY.backup,null); return t ? Math.floor((Date.now()-new Date(t))/864e5) : null }

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lv = (ex,i) => { const L=EX[ex].levels[i]; return {name:L[0],cue:L[1],min:L[2],max:L[3]} };
const unitTxt = ex => EX[ex].unit==="s" ? "s" : "reps";
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10) };
const fmtDate = iso => new Date(iso+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
function nextDay(){ const last=S.sessions[S.sessions.length-1]; return last && last.day==="A" ? "B" : "A" }
function weekNo(){
  if(!S.sessions.length) return 1;
  const first = new Date(S.sessions[0].date+"T12:00:00"), now = new Date();
  return Math.floor((now-first)/(7*864e5))+1;
}
const isDeload = () => S.sessions.length>0 && weekNo() % DELOAD_EVERY === 0;
function entriesFor(ex){ return S.sessions.filter(s=>s.entries && s.entries[ex]).map(s=>({date:s.date,...s.entries[ex]})) }
function lastValues(ex, level){
  const e = entriesFor(ex).filter(x=>x.level===level).pop();
  return e ? e.sets.slice(0,SETS) : Array(SETS).fill(lv(ex,level).min);
}
function score(e, ex){ const L=lv(ex,e.level); const done=e.sets.filter((v,i)=>e.done[i]); const best=done.length?Math.max(...done):0; return e.level + Math.min(best/L.max,1) }
function status(ex){
  const cur = S.levels[ex], es = entriesFor(ex).filter(x=>x.level===cur);
  if(!es.length) return {cls:"new",txt:"New level"};
  if(es.length>=3){
    const tot = e => e.sets.reduce((a,v,i)=>a+(e.done[i]?v:0),0);
    const last3 = es.slice(-3);
    if(tot(last3[2]) <= tot(last3[0])) return {cls:"stall",txt:"Stalled"};
  }
  const L=lv(ex,cur), last=es[es.length-1];
  const close = last.sets.every((v,i)=>last.done[i] && v>=L.max-1);
  return close ? {cls:"up",txt:"Close to level-up"} : {cls:"ok",txt:"Building"};
}

/* ---------- Draft (in-progress session, kept on this device) ---------- */
function newDraft(d){
  const entries = {};
  DAYS[d].pairs.flat().concat("handstand").forEach(ex=>{
    const l=S.levels[ex]; entries[ex]={level:l, sets:lastValues(ex,l), done:Array(SETS).fill(false)};
  });
  return {day:d, date:todayISO(), warm:Array(WARMUP.length).fill(false), entries};
}
function ensureDraft(){
  if(!day) day = draft ? draft.day : nextDay();
  if(!draft || draft.day!==day){ draft = newDraft(day); LS.set(KEY.draft,draft) }
  // keep levels in line with the program if changed elsewhere
  Object.keys(draft.entries).forEach(ex=>{
    const l=S.levels[ex];
    if(draft.entries[ex].level!==l && !draft.entries[ex].done.some(Boolean)){ draft.entries[ex]={level:l,sets:lastValues(ex,l),done:Array(SETS).fill(false)} }
  });
}
const saveDraft = () => LS.set(KEY.draft,draft);

/* ---------- Render ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  const v = document.getElementById("view");
  if(!S.loaded){ v.innerHTML = '<p class="empty">Loading your training log…</p>'; return }
  v.innerHTML = tab==="train" ? viewTrain() : tab==="progress" ? viewProgress() : viewProgram();
}

function exCard(ex){
  const e = draft.entries[ex], L = lv(ex,e.level), step = EX[ex].unit==="s" ? 5 : 1;
  const sets = e.sets.map((val,i)=>`
    <div class="set">
      <span class="n">Set ${i+1}</span>
      <div style="display:flex;align-items:center">
        <div class="step">
          <button type="button" data-act="dec" data-ex="${ex}" data-i="${i}" data-step="${step}" aria-label="Less">−</button>
          <input id="v-${ex}-${i}" type="number" inputmode="numeric" min="0" value="${val}" data-act="val" data-ex="${ex}" data-i="${i}" aria-label="${esc(EX[ex].name)} set ${i+1}">
          <button type="button" data-act="inc" data-ex="${ex}" data-i="${i}" data-step="${step}" aria-label="More">+</button>
        </div>
        <span class="unit">${unitTxt(ex)}</span>
      </div>
      <button type="button" class="tick" data-act="done" data-ex="${ex}" data-i="${i}" aria-pressed="${e.done[i]}" aria-label="Mark set ${i+1} done">✓</button>
    </div>`).join("");
  const allTop = e.sets.every((v,i)=>e.done[i] && v>=L.max);
  return `<div class="card">
    <div class="ex-top"><div><div class="pattern">${esc(EX[ex].pattern)}</div><h3>${esc(L.name)}</h3></div>
    <span class="lvl">Level ${e.level+1}/${EX[ex].levels.length}</span></div>
    <div class="cue">${esc(L.cue)}</div>
    <div class="target">Target ${SETS} × ${L.min}–${L.max} ${unitTxt(ex)}${allTop?' · <span class="hit">top of range hit, levels up on finish</span>':''}</div>
    <div class="sets">${sets}</div>
  </div>`;
}

function viewTrain(){
  ensureDraft();
  const D = DAYS[day], doneSets = Object.values(draft.entries).reduce((a,e)=>a+e.done.filter(Boolean).length,0);
  const totalSets = Object.keys(draft.entries).length*SETS;
  const deload = isDeload() ? `<div class="banner deload"><b>Deload week (week ${weekNo()}).</b> Do 2 sets per exercise and stop 1–2 reps short of your best. Levels don't change this week.</div>` : "";
  const first = !S.sessions.length ? `<div class="banner info">Starting levels are set from your current numbers: 3–4 pull-ups, 8–10 push-ups, 3–4 dips, plank 30–40 s. Adjust any of them in Program if the first session feels too easy or too hard.</div>` : "";
  const lb = lastBackupDays();
  const remind = S.sessions.length>=3 && (lb===null || lb>=14) ? `<div class="banner backup"><b>No backup for ${lb===null?"this log yet":lb+" days"}.</b> Save one in Progress, under Your data.</div>` : "";
  return `<div class="block">
    ${first}${deload}${remind}
    <div class="daybar">
      <div><h2>${D.label}</h2><div class="sub">${esc(D.focus)} · ${fmtDate(draft.date)}</div></div>
      <div class="seg" role="group" aria-label="Session">
        <button type="button" data-act="day" data-day="A" aria-pressed="${day==="A"}">Day A</button>
        <button type="button" data-act="day" data-day="B" aria-pressed="${day==="B"}">Day B</button>
      </div>
    </div>
    <div class="block-h"><h3>1 · Warm-up</h3><span class="min">~7 min</span></div>
    <div class="checklist">${WARMUP.map((w,i)=>`<button type="button" class="check" data-act="warm" data-i="${i}" aria-pressed="${draft.warm[i]}"><span class="box">✓</span><span class="t">${esc(w)}</span></button>`).join("")}</div>
    <div class="block-h"><h3>2 · Skill, while fresh</h3><span class="min">~7 min</span></div>
    ${exCard("handstand")}
    ${D.pairs.map((p,k)=>`<div class="block-h"><h3>${k+3} · Pair ${String.fromCharCode(65+k)}</h3><span class="min">alternate, 90 s rest · ~8 min</span></div><div class="pair">${exCard(p[0])}${exCard(p[1])}</div>`).join("")}
    <div class="card">
      <div class="finish">
        <button type="button" class="btn primary" data-act="finish" ${doneSets?"":"disabled"}>Finish session</button>
        <button type="button" class="btn ghost" data-act="resetdraft">Clear</button>
        <span class="sub">${doneSets}/${totalSets} sets done</span>
      </div>
      <div class="sub">On finish, an exercise moves up a level when all ${SETS} sets are done at the top of the range.</div>
    </div>
  </div>`;
}

function spark(ex){
  const es = entriesFor(ex); if(es.length<2) return `<div class="last">${es.length?"1 session logged":"No sessions yet"}</div>`;
  const pts = es.slice(-20).map(e=>score(e,ex)), n=pts.length;
  const lo = Math.floor(Math.min(...pts)), hi = Math.ceil(Math.max(...pts)+.01);
  const W=200,H=56,P=4, x=i=>P+i*(W-2*P)/(n-1), y=v=>H-P-(v-lo)/(hi-lo||1)*(H-2*P);
  const d = pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const grid = []; for(let g=lo; g<=hi; g++) grid.push(`<line x1="0" x2="${W}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(EX[ex].name)} progress over ${n} sessions">
    ${grid.join("")}
    <path d="${d} L${x(n-1)},${H-P} L${x(0)},${H-P}Z" fill="var(--accent-soft)" stroke="none"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(n-1)}" cy="${y(pts[n-1])}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}

function calendar(){
  const weeks=12, cell=16, gap=4, now=new Date(); now.setHours(12,0,0,0);
  const monday = new Date(now); monday.setDate(now.getDate()-((now.getDay()+6)%7)-7*(weeks-1));
  const by = {}; S.sessions.forEach(s=>{ by[s.date]=s.day });
  let out=""; const lab=["M","T","W","T","F","S","S"];
  for(let r=0;r<7;r++) out+=`<text x="0" y="${22+r*(cell+gap)+12}" font-size="10" fill="var(--muted)" font-family="var(--mono)">${lab[r]}</text>`;
  for(let w=0;w<weeks;w++){
    for(let r=0;r<7;r++){
      const d=new Date(monday); d.setDate(monday.getDate()+w*7+r);
      const iso=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
      const s=by[iso], fut=d>now;
      const fill = s ? (s==="A"?"var(--accent)":"var(--chalk)") : "var(--line)";
      out+=`<rect x="${16+w*(cell+gap)}" y="${22+r*(cell+gap)}" width="${cell}" height="${cell}" rx="4" fill="${fill}" opacity="${fut?0.35:1}"><title>${iso}${s?" · Day "+s:""}</title></rect>`;
    }
    if(w%4===0){ const d=new Date(monday); d.setDate(monday.getDate()+w*7);
      out+=`<text x="${16+w*(cell+gap)}" y="12" font-size="10" fill="var(--muted)" font-family="var(--mono)">${d.toLocaleDateString(undefined,{day:"numeric",month:"short"})}</text>` }
  }
  const W=16+weeks*(cell+gap), H=22+7*(cell+gap);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions over the last 12 weeks">${out}</svg>`;
}

function viewProgress(){
  const n=S.sessions.length;
  const monday=new Date(); monday.setHours(0,0,0,0); monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
  const thisWeek=S.sessions.filter(s=>new Date(s.date+"T12:00:00")>=monday).length;
  const ups=S.sessions.reduce((a,s)=>a+(s.levelUps||[]).length,0);
  const allEx=["handstand",...DAYS.A.pairs.flat(),...DAYS.B.pairs.flat()];
  const cards = allEx.map(ex=>{
    const cur=S.levels[ex], L=lv(ex,cur), st=status(ex), es=entriesFor(ex), last=es[es.length-1];
    const tip = st.cls==="stall" ? `<div class="cue">Three sessions without improvement. Drop one level for two weeks, then build back. Check sleep and rest days too.</div>` : "";
    return `<div class="card">
      <div class="ex-top"><div><div class="pattern">${esc(EX[ex].pattern)}</div><h3>${esc(L.name)}</h3></div><span class="pill ${st.cls}">${st.txt}</span></div>
      <div class="ladder" aria-label="Level ${cur+1} of ${EX[ex].levels.length}">${EX[ex].levels.map((_,i)=>`<i class="${i<=cur?"on":""}"></i>`).join("")}</div>
      ${spark(ex)}
      <div class="last">${last?`Last ${fmtDate(last.date)}: ${last.sets.map((v,i)=>last.done[i]?v:"–").join(" / ")} ${unitTxt(ex)} at level ${last.level+1}`:"Not trained yet"}</div>
      ${tip}
    </div>`;
  }).join("");
  const hist = S.sessions.slice().reverse().slice(0,30).map(s=>{
    const sets=Object.values(s.entries||{}).reduce((a,e)=>a+e.done.filter(Boolean).length,0);
    const ups=(s.levelUps||[]).map(ex=>EX[ex]?EX[ex].name:ex).join(", ");
    return `<div class="card"><div class="row"><div><b>${fmtDate(s.date)}</b> · Day ${s.day}<div class="meta">${sets} sets${ups?` · level-up: ${esc(ups)}`:""}</div></div>
      <span id="del-${s.id}"><button type="button" class="btn ghost" data-act="askdel" data-id="${s.id}">Delete</button></span></div></div>`;
  }).join("");
  return `<div class="block">
    <div class="stats">
      <div class="stat"><b>${n}</b><span>sessions logged</span></div>
      <div class="stat"><b>${thisWeek}/3</b><span>this week</span></div>
      <div class="stat"><b>${n?weekNo():0}</b><span>training week${isDeload()?" · deload":""}</span></div>
      <div class="stat"><b>${ups}</b><span>level-ups</span></div>
    </div>
    <div class="card"><div class="block-h"><h3>Last 12 weeks</h3><span class="sub"><span style="color:var(--accent)">■</span> Day A &nbsp;<span style="color:var(--chalk)">■</span> Day B</span></div><div class="cal">${calendar()}</div></div>
    <div class="block-h"><h2>Movements</h2><span class="sub">Line = level + share of the top of range reached</span></div>
    <div class="grid2">${cards}</div>
    <div class="card">
      <div class="block-h"><h3>Your data</h3><span class="sub">${S.persistent===true?"Storage protected":S.persistent===false?"Browser may clear storage":""}</span></div>
      <div class="sub">Your log lives only in this browser on this phone. Save a backup now and then and keep it off the phone. The CSV has one row per set, for a spreadsheet or Python.</div>
      <div class="data-actions">
        <button type="button" class="btn primary" data-act="export">Save backup (JSON)</button>
        <button type="button" class="btn ghost" data-act="csv" ${n?"":"disabled"}>Export sets (CSV)</button>
        <button type="button" class="btn ghost" data-act="import">Restore from backup</button>
        <input type="file" id="importfile" accept=".json,application/json" hidden>
      </div>
      <div class="last">Last backup: ${lastBackupDays()===null?"never":lastBackupDays()===0?"today":lastBackupDays()+" days ago"}</div>
    </div>
    <div class="block-h"><h2>History</h2></div>
    <div class="hist">${hist || '<p class="empty">Finished sessions appear here. Start with today\'s session in Train.</p>'}</div>
  </div>`;
}

function viewProgram(){
  const allEx=["handstand",...DAYS.A.pairs.flat(),...DAYS.B.pairs.flat()];
  const ladders = allEx.map(ex=>`<div class="card">
    <div class="ex-top"><div><div class="pattern">${esc(EX[ex].pattern)}</div><h3>${esc(EX[ex].name)}</h3></div><span class="lvl">${unitTxt(ex)}</span></div>
    <ul class="lv-list">${EX[ex].levels.map((L,i)=>`<li class="${i===S.levels[ex]?"cur":""}"><span class="k">${i+1}</span><span>${esc(L[0])} <span class="r">${L[2]}–${L[3]}</span></span>${i===S.levels[ex]?'<span class="pill new">Current</span>':`<button type="button" data-act="setlvl" data-ex="${ex}" data-i="${i}">Set</button>`}</li>`).join("")}</ul>
  </div>`).join("");
  return `<div class="block">
    <div class="card prose">
      <h2>How the program works</h2>
      <ul>
        <li><b>Schedule.</b> Three full-body sessions a week on non-consecutive days, alternating Day A and Day B (A-B-A one week, B-A-B the next).</li>
        <li><b>Session order.</b> Warm-up, handstand practice while fresh, then three strength pairs. Alternate the two exercises of a pair with about 90 s rest between sets.</li>
        <li><b>Balance.</b> Each week covers vertical and horizontal pulling and pushing, straight-arm pulling and pushing, compression, core, and both squat and hinge leg patterns.</li>
        <li><b>Progression by leverage.</b> Each movement has a ladder of harder variations. When all ${SETS} sets reach the top of the range, the exercise moves up a level and you start the new level at the bottom of its range.</li>
        <li><b>Straight-arm work goes slowly.</b> Front lever and planche load the elbows and tendons, which adapt more slowly than muscle. Stay at a level until the holds are clean.</li>
        <li><b>Deloads.</b> Every ${DELOAD_EVERY}th week is lighter: 2 sets, stop short of your best, no level changes.</li>
        <li><b>Stalls.</b> Three sessions at the same level without improvement is a stall. Drop one level for two weeks and build back.</li>
        <li><b>Equipment.</b> Pull-up bar for pull-ups, hangs and leg raises; parallettes for L-sits, planche leans and deeper push-ups; dips need parallel bars or two sturdy chairs; rows need a sturdy table edge or a low bar.</li>
      </ul>
    </div>
    <div class="block-h"><h2>Ladders</h2><span class="sub">Ranges are per set</span></div>
    <div class="grid2">${ladders}</div>
  </div>`;
}

/* ---------- Actions ---------- */
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.innerHTML=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,4500) }

async function finish(){
  const deload=isDeload(), ups=[], entries={};
  Object.entries(draft.entries).forEach(([ex,e])=>{
    if(!e.done.some(Boolean)) return;
    entries[ex]={level:e.level, sets:e.sets.map(Number), done:e.done.slice()};
    const L=lv(ex,e.level);
    if(!deload && e.done.every(Boolean) && e.sets.every(v=>Number(v)>=L.max) && e.level<EX[ex].levels.length-1){ ups.push(ex) }
  });
  const s={id:"s"+Date.now(), date:draft.date, ts:Date.now(), day:draft.day, warmup:draft.warm.filter(Boolean).length, entries, levelUps:ups};
  try{
    await saveSession(s);
    if(ups.length){ ups.forEach(ex=>S.levels[ex]=S.levels[ex]+1); await saveLevels() }
  }catch(e){ toast("Could not save the session on this phone. Free some space or save a backup, then press Finish again."); return }
  draft=null; LS.set(KEY.draft,null); day=nextDayAfter(s.day);
  toast(ups.length ? `<b>Session saved.</b> Level-up: ${ups.map(ex=>esc(EX[ex].name)+" → "+esc(lv(ex,S.levels[ex]).name)).join("; ")}.` : "<b>Session saved.</b> Same levels next time; aim for one more rep or a few more seconds.");
  render();
}
const nextDayAfter = d => d==="A" ? "B" : "A";

document.addEventListener("click", async ev=>{
  const b = ev.target.closest("[data-act],[data-tab]"); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); window.scrollTo(0,0); return }
  const a=b.dataset.act, ex=b.dataset.ex, i=+b.dataset.i;
  if(a==="inc"||a==="dec"){ const e=draft.entries[ex]; e.sets[i]=Math.max(0,Number(e.sets[i])+(a==="inc"?1:-1)*Number(b.dataset.step)); saveDraft(); render() }
  else if(a==="done"){ const e=draft.entries[ex]; e.done[i]=!e.done[i]; saveDraft(); render(); if(e.done[i]) startTimer() }
  else if(a==="warm"){ draft.warm[i]=!draft.warm[i]; saveDraft(); render() }
  else if(a==="day"){ if(draft && draft.day!==b.dataset.day && Object.values(draft.entries).some(e=>e.done.some(Boolean))){ toast("Finish or clear the current session before switching day."); return } day=b.dataset.day; draft=null; render() }
  else if(a==="finish"){ b.disabled=true; await finish() }
  else if(a==="resetdraft"){ draft=null; LS.set(KEY.draft,null); render() }
  else if(a==="setlvl"){ S.levels[ex]=i; try{ await saveLevels() }catch(e){ toast("Could not save the level.") } if(draft){ draft=null; LS.set(KEY.draft,null) } render(); toast(`${esc(EX[ex].name)} set to ${esc(lv(ex,i).name)}.`) }
  else if(a==="askdel"){ document.getElementById("del-"+b.dataset.id).innerHTML=`<button type="button" class="btn danger" data-act="del" data-id="${b.dataset.id}">Confirm delete</button> <button type="button" class="btn ghost" data-act="nodel">Keep</button>` }
  else if(a==="nodel"){ render() }
  else if(a==="export"){ await exportBackup() }
  else if(a==="csv"){ await exportCSV() }
  else if(a==="import"){ document.getElementById("importfile").click() }
  else if(a==="del"){ try{ await deleteSession(b.dataset.id); toast("Session deleted. Levels were not changed; adjust them in Program if needed.") }catch(e){ toast("Could not delete the session.") } render() }
});
document.addEventListener("change", ev=>{
  const t=ev.target;
  if(t.id==="importfile"){ if(t.files && t.files[0]) importBackup(t.files[0]); t.value=""; return }
  if(t.dataset.act!=="val") return;
  draft.entries[t.dataset.ex].sets[+t.dataset.i]=Math.max(0,Number(t.value)||0); saveDraft(); render();
});

/* ---------- Rest timer ---------- */
let tEnd=0, tInt=null;
function startTimer(){ tEnd=Date.now()+90000; document.getElementById("treset").hidden=false; clearInterval(tInt); tInt=setInterval(tick,250); tick() }
function tick(){ const left=Math.max(0,Math.round((tEnd-Date.now())/1000)); document.getElementById("tclock").textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; if(!left){ clearInterval(tInt); document.getElementById("tclock").textContent="Go" } }
document.getElementById("tstart").onclick=startTimer;
document.getElementById("treset").onclick=()=>{ clearInterval(tInt); document.getElementById("tclock").textContent="1:30"; document.getElementById("treset").hidden=true };

render();
initStore();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}) }
</script>
</body>
</html>
